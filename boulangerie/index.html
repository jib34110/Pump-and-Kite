<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f1d10">
<title>La Mie Dorée</title>
<style>
/* Direction : boulangerie de quartier, bois chaud, crème et croûte dorée. Thème unique volontaire. */
:root {
  --creme: #fbf3e3;
  --creme2: #f1e0bf;
  --brun: #5a3820;
  --brunF: #2f1d10;
  --dore: #e3a33b;
  --doreF: #a8691a;
  --rouge: #b94a35;
  --vert: #4f8a45;
  --texte: #3a2414;
  --police: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--brunF); color: var(--texte); font-family: var(--police);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#jeu {
  position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--brunF);
}
#hud {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--brun); color: var(--creme);
  font-size: 14px; white-space: nowrap; min-height: 46px; box-shadow: 0 2px 0 rgba(0,0,0,.25); z-index: 3;
}
#hud .bloc { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
#hud .petit { font-size: 11px; opacity: .8; }
#hud .espace { flex: 1; }
#hNiv { display: flex; flex-direction: column; gap: 3px; min-width: 64px; }
.barre { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: var(--dore); transition: width .3s; }
#hud button {
  font: inherit; font-size: 18px; width: 40px; height: 36px; border-radius: 10px; border: 0;
  background: rgba(255,255,255,.12); color: var(--creme); cursor: pointer;
}
#hud button:focus-visible, button:focus-visible { outline: 3px solid var(--dore); outline-offset: 2px; }
#hArgent { font-weight: 700; font-variant-numeric: tabular-nums; }
#hHorloge { font-variant-numeric: tabular-nums; font-weight: 700; color: #ffd98c; }
main { position: relative; overflow: hidden; background: #e9d3ae; }
#toile { display: block; width: 100%; height: 100%; touch-action: none; }
#barre {
  display: flex; gap: 8px; justify-content: center; padding: 8px 10px; background: var(--brunF); min-height: 66px; flex-wrap: wrap;
}
.btn {
  font: inherit; font-weight: 700; font-size: 17px; min-height: 50px; padding: 0 18px; border-radius: 14px; border: 0;
  background: var(--dore); color: var(--brunF); box-shadow: 0 4px 0 var(--doreF); cursor: pointer; flex: 0 1 auto; max-width: 100%;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--doreF); }
.btn.sec { background: var(--creme2); box-shadow: 0 4px 0 #b99a6c; }
.btn.danger { background: #e7b3a6; box-shadow: 0 4px 0 #a5584a; }
.btn.petit { min-height: 38px; font-size: 14px; padding: 0 12px; border-radius: 10px; box-shadow: 0 3px 0 var(--doreF); }
.btn.petit.sec { box-shadow: 0 3px 0 #b99a6c; }
.btn:disabled { opacity: .45; cursor: default; }
#panneau {
  position: absolute; inset: 0; overflow-y: auto; background: rgba(47,29,16,.62); padding: 12px; z-index: 4;
  -webkit-overflow-scrolling: touch; -webkit-user-select: text; user-select: text;
}
.carte {
  max-width: 760px; margin: 0 auto 12px; background: var(--creme); border-radius: 18px; padding: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.25);
}
.carte h1 { font-size: 30px; margin: 0 0 4px; color: var(--brun); text-wrap: balance; }
.carte h2 { font-size: 20px; margin: 0 0 10px; color: var(--brun); text-wrap: balance; }
.carte h3 { font-size: 16px; margin: 14px 0 6px; color: var(--brun); }
.carte p { margin: 6px 0; line-height: 1.45; }
.discret { color: #7b6048; font-size: 13px; }
.onglets { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.onglet {
  font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--creme2); color: var(--brun);
  cursor: pointer; white-space: nowrap;
}
.onglet.actif { background: var(--brun); color: var(--creme); }
.liste { display: flex; flex-direction: column; gap: 8px; }
.ligne {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: #fffaf0;
  border-radius: 12px; padding: 8px 10px; border: 1px solid #ead6b2;
}
.ligne > div { min-width: 0; }
.ligne img { width: 44px; height: 44px; }
.ligne b { display: block; }
.ligne .act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ligne.verrou { opacity: .55; }
.chiffres { font-variant-numeric: tabular-nums; }
table.bilan { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.bilan td { padding: 5px 4px; border-bottom: 1px solid #ead6b2; }
table.bilan td:last-child { text-align: right; white-space: nowrap; }
table.bilan tr.total td { font-weight: 700; border-top: 2px solid var(--brun); border-bottom: 0; font-size: 17px; }
.pos { color: var(--vert); } .neg { color: var(--rouge); }
.alerte { background: #fde7c2; border: 2px solid var(--dore); border-radius: 12px; padding: 10px; margin: 8px 0; }
.grille2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: #fffaf0; border: 1px solid #ead6b2; border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.dosage { font-size: 13px; color: #6b5038; }
.mini { height: 6px; border-radius: 3px; background: #ead6b2; overflow: hidden; margin-top: 4px; }
.mini i { display: block; height: 100%; background: var(--dore); }
.titre-accueil { text-align: center; }
.titre-accueil h1 { font-size: 38px; letter-spacing: .5px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
label.case { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
label.case input { width: 22px; height: 22px; }
#bulle {
  position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; max-width: 560px; margin: 0 auto; z-index: 5;
  background: #fffaf0; border: 3px solid var(--dore); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: entree .25s ease-out;
}
#bulle .avatar { font-size: 30px; line-height: 1; }
#bulle .corps { flex: 1; min-width: 0; }
#bulle .nom { font-weight: 700; color: var(--doreF); font-size: 13px; }
#bulle p { margin: 2px 0 6px; font-size: 14px; line-height: 1.3; }
#bulle .act { display: flex; gap: 8px; flex-wrap: wrap; }
#toast {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--brun); color: var(--creme);
  padding: 9px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; z-index: 6; pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.3); max-width: calc(100% - 24px); text-align: center; transition: opacity .25s;
}
[hidden] { display: none !important; }
@keyframes entree { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 420px) {
  #hud { gap: 6px; padding: 5px 6px; font-size: 13px; }
  #hDate { display: none; }
  #hud button { width: 34px; }
  .btn { font-size: 16px; padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) { #bulle { animation: none; } .barre i { transition: none; } }
</style>
</head>
<body>
<div id="jeu">
  <header id="hud">
    <div class="bloc"><b id="hJour">Jour 1</b><span class="petit" id="hDate"></span></div>
    <div id="hHorloge"></div>
    <div class="espace"></div>
    <div id="hArgent">0,00 €</div>
    <div id="hNiv"><span id="hNivT">Niv. 1</span><div class="barre"><i id="hXp"></i></div></div>
    <div id="hRep" title="Réputation">★ 2,5</div>
    <button id="bMuet" type="button" aria-label="Couper le son">🔊</button>
    <button id="bMenu" type="button" aria-label="Menu">☰</button>
  </header>
  <main id="scene">
    <canvas id="toile"></canvas>
    <section id="panneau" hidden></section>
    <div id="bulle" hidden>
      <div class="avatar" aria-hidden="true">👨‍🍳</div>
      <div class="corps">
        <div class="nom">Jean-Baptiste · boulangerie Chez les voisins, Frontignan</div>
        <p id="bulleTexte"></p>
        <div class="act">
          <button class="btn petit" id="bulleOk" type="button">Compris</button>
          <button class="btn petit sec" id="bullePasser" type="button">Passer le tutoriel</button>
        </div>
      </div>
    </div>
    <div id="toast" hidden></div>
  </main>
  <footer id="barre"></footer>
</div>
<script>
// @ts-check
'use strict';
(function () {

// =====================================================================
// 1. TYPES
// =====================================================================
/** @typedef {'farine'|'farineComplete'|'eau'|'sel'|'levure'|'lait'|'sucre'|'beurre'|'chocolat'|'oeufs'|'creme'|'pommes'} IngredientId */
/** @typedef {'baguette'|'tradition'|'croissant'|'painChoc'|'complet'|'buche'|'eclair'|'tarte'} ProduitId */
/** @typedef {'petrir'|'faconner'|'pousse'|'scarifier'|'cuire'} EtapeId */
/** @typedef {'boudin'|'triangle'|'carre'|'spirale'|'ligne'|'cercle'} FormeId */
/** @typedef {'fournier'|'vendeur'|'plongeur'} RoleId */
/** @typedef {'pate'|'four'|'vente'|'menage'} TacheId */
/** @typedef {'chambrePousse'|'petrin'|'secondFour'|'vitrine'|'boutique2'} AmeliorationId */
/** @typedef {'panneFour'|'inspection'|'grosClient'|'fete'|'marcheNoel'} EvenementId */
/** @typedef {'accueil'|'preparation'|'matin'|'midi'|'caisse'|'menage'|'bilan'|'faillite'} Phase */
/** @typedef {'jour'|'reserve'|'recettes'|'equipe'|'travaux'} Onglet */
/** @typedef {'clic'|'succes'|'echec'|'piece'|'ding'|'pate'|'frotte'|'niveau'|'clochette'|'coupe'} SonId */

/** @typedef {{id: IngredientId, nom: string, prixKg: number, stockInitial: number, lot: number, illimite: boolean}} Ingredient */
/** @typedef {{ingredient: IngredientId, grammes: number}} Dosage */
/**
 * @typedef {Object} Recette
 * @property {ProduitId} id
 * @property {string} nom
 * @property {string} pluriel
 * @property {number} pieces       Pièces par pâte de base
 * @property {number} prix         Prix de base en centimes
 * @property {ReadonlyArray<Dosage>} dosages  Pour une pâte de base, en grammes
 * @property {ReadonlyArray<EtapeId>} etapes
 * @property {FormeId} forme
 * @property {number} pousse       Secondes réelles
 * @property {number} cuisson      Secondes réelles
 * @property {number} niveau       Niveau de patron requis
 * @property {number} jourMin
 * @property {'toute'|'noel'} saison
 * @property {number} popularite
 * @property {number} qteMax
 */
/** @typedef {{recette: ProduitId, etoiles: number, prix: number}} Produit */
/** @typedef {{niv: number, xp: number}} Competence */
/** @typedef {'plan'|'pousse'|'four'} LieuFournee */
/**
 * @typedef {Object} Fournee
 * @property {number} id
 * @property {ProduitId} recette
 * @property {number} mult
 * @property {number} etape
 * @property {LieuFournee} lieu
 * @property {number} minuteur
 * @property {number} duree
 * @property {number[]} notes
 * @property {number} manuel
 * @property {number} cibleOuvrier  Moment où l'ouvrier du four défourne (0 = pas encore tiré)
 */
/** @typedef {{produit: ProduitId, qte: number}} LigneCommande */
/**
 * @typedef {Object} Client
 * @property {number} id
 * @property {LigneCommande[]} commande
 * @property {number} patience
 * @property {number} patienceMax
 * @property {number} arrivee
 * @property {number} x
 * @property {string} teinte
 * @property {string} habit
 * @property {number} humeur
 * @property {number} erreurs
 * @property {boolean} special
 * @property {number} sortie   -1 tant que le client est dans la file
 */
/**
 * @typedef {Object} Employe
 * @property {number} id
 * @property {string} nom
 * @property {RoleId} role
 * @property {number} competence
 * @property {number} potentiel
 * @property {number} salaire    Centimes par jour
 * @property {number} moral
 * @property {boolean} enFormation
 * @property {number} jours
 * @property {Record<TacheId, Competence>} taches  Niveau 1 à 10 par tâche
 * @property {TacheId|null} affectation  Tâche du jour (à redonner chaque matin pour un fournier)
 */
/** @typedef {{id: number, nom: string, tache: TacheId, actions: number, notes: number[], ventesAdd: number, caAdd: number, manquees: number}} StatOuvrier */
/** @typedef {{emp: number, fournee: number, t: number, duree: number}} TravailOuvrier */
/** @typedef {{jour: number, ca: number, benefice: number}} Historique */
/**
 * @typedef {Object} EtatDeJeu
 * @property {number} version
 * @property {number} jour
 * @property {number} argent     Centimes
 * @property {number} niveau
 * @property {number} xp
 * @property {number} reputation 0 à 5
 * @property {number} proprete   0 à 1
 * @property {Record<IngredientId, number>} stock  Grammes
 * @property {Record<ProduitId, Competence>} competences
 * @property {Employe[]} employes
 * @property {Employe[]} candidats
 * @property {Record<AmeliorationId, boolean>} ameliorations
 * @property {boolean} tutoriel
 * @property {string[]} tutoVus
 * @property {boolean} muet
 * @property {boolean} aideMonnaie  Affiche le montant à rendre (pas de bonus)
 * @property {Historique[]} historique
 * @property {EvenementId|null} evenement
 * @property {number} prochainId
 */
/**
 * @typedef {Object} Journal
 * @property {number} ca
 * @property {number} braderie
 * @property {number} coutMatieres
 * @property {Record<ProduitId, number>} ventes
 * @property {number} clientsServis
 * @property {number} clientsPerdus
 * @property {number[]} satisfactions
 * @property {number} xp
 * @property {number} invendusPerdus
 * @property {number} invendusBrades
 * @property {number} fourneesFaites
 * @property {number} fourneesRatees
 * @property {boolean|null} caisseJuste
 * @property {number} proprete
 * @property {number} amende
 * @property {number} bonusCalcul
 * @property {number} heureOuverture
 * @property {StatOuvrier[]} ouvriers
 * @property {number} niveauAvant
 * @property {string[]} notes
 */
/** @typedef {{x: number, y: number}} Point */
/** @typedef {{x: number, y: number, w: number, h: number}} Rect */
/**
 * @typedef {Object} MJPetrir
 * @property {'petrir'} type
 * @property {number} fournee
 * @property {number} temps
 * @property {number} limite
 * @property {boolean} fini
 * @property {number} finT
 * @property {number} etoiles
 * @property {string} texte
 * @property {number} angle
 * @property {number|null} dernier
 * @property {number[]} tours
 * @property {number} debut
 * @property {number} requis
 */
/**
 * @typedef {Object} MJFaconner
 * @property {'faconner'} type
 * @property {number} fournee
 * @property {number} temps
 * @property {number} limite
 * @property {boolean} fini
 * @property {number} finT
 * @property {number} etoiles
 * @property {string} texte
 * @property {FormeId} forme
 * @property {Point[]} chemin
 * @property {Point[]} trace
 * @property {boolean} actif
 */
/**
 * @typedef {Object} MJScarifier
 * @property {'scarifier'} type
 * @property {number} fournee
 * @property {number} temps
 * @property {number} limite
 * @property {boolean} fini
 * @property {number} finT
 * @property {number} etoiles
 * @property {string} texte
 * @property {Point[]} trace
 * @property {boolean} actif
 * @property {number} t0
 */
/** @typedef {MJPetrir|MJFaconner|MJScarifier} MiniJeu */
/**
 * @typedef {Object} Paiement
 * @property {Client} client
 * @property {number} total
 * @property {number} donne
 * @property {number} rendu
 * @property {boolean} partiel
 * @property {number} qualite
 */
/**
 * @typedef {Object} EtatComptoir
 * @property {Client[]} clients
 * @property {Client[]} aVenir
 * @property {Client[]} sortants
 * @property {number} temps
 * @property {number} duree
 * @property {Record<ProduitId, number>} plateau
 * @property {Paiement|null} paiement
 * @property {string} message
 * @property {number} messageT
 * @property {boolean} fermeture
 * @property {number} finT
 * @property {Client|null} vendeurClient
 * @property {number} vendeurT
 * @property {number} ouverture  Heure d'ouverture (en heures, ex. 8,5)
 */
/** @typedef {{valeur: number, n: number}} Coupure */
/** @typedef {{attendu: number, saisie: string, contenu: Coupure[], resultat: boolean|null, t: number}} EtatCaisse */
/** @typedef {{zone: number, nx: number, ny: number, nr: number, sale: number}} Tache */
/** @typedef {{taches: Tache[], temps: number, duree: number, fini: boolean}} EtatMenage */
/**
 * @typedef {Object} Bilan
 * @property {number} ca
 * @property {number} braderie
 * @property {number} matieres
 * @property {number} charges
 * @property {number} salaires
 * @property {number} reparation
 * @property {number} amende
 * @property {number} boutique2
 * @property {number} bonusCalcul
 * @property {number} benefice
 * @property {number} repAvant
 * @property {number} repApres
 * @property {string[]} notes
 */
/**
 * @typedef {Object} EtapeTuto
 * @property {string} id
 * @property {number} jour   0 = n'importe quel jour du tutoriel
 * @property {Phase} phase
 * @property {string} texte
 * @property {() => boolean} quand
 * @property {(() => boolean)|null} fini
 * @property {string|null} cible
 * @property {boolean} pause
 */
/**
 * @typedef {Object} Session
 * @property {Phase} phase
 * @property {Fournee[]} fournees
 * @property {number} prochaineFournee
 * @property {Record<ProduitId, Produit[]>} vitrine
 * @property {number} horloge
 * @property {number} dureeMatin
 * @property {MiniJeu|null} mj
 * @property {EtatComptoir|null} comptoir
 * @property {EtatCaisse|null} caisse
 * @property {EtatMenage|null} menage
 * @property {Journal} journal
 * @property {Bilan|null} bilan
 * @property {Client[]} planClients
 * @property {Record<ProduitId, number>} demande
 * @property {Onglet} onglet
 * @property {boolean} menu
 * @property {boolean} reserveExpress
 * @property {boolean} confirmer
 * @property {EtapeTuto|null} tuto
 * @property {number} repAvant
 * @property {TravailOuvrier[]} travaux
 */
/** @typedef {{id: string, r: Rect, action: () => void, glisser: ProduitId|null}} Zone */
/** @typedef {'farine'|'fumee'|'vapeur'|'piece'|'bulle'|'etincelle'} TypeParticule */
/** @typedef {{x: number, y: number, vx: number, vy: number, vie: number, max: number, taille: number, type: TypeParticule}} Particule */
/** @typedef {{id: AmeliorationId, nom: string, prix: number, niveau: number, effet: string}} Amelioration */
/** @typedef {{nom: string, texte: string}} InfoEvenement */

// =====================================================================
// 2. ÉQUILIBRAGE (modifiable ici)
// =====================================================================
const VERSION = 1;
const CLE_SAUVEGARDE = 'laMieDoree.sauvegarde.v1';

const CONFIG = Object.freeze({
  capitalInitial: 150000,      // centimes (1 500 €)
  chargesJour: 2000,           // loyer + énergie
  fondDeCaisse: 5000,
  dureeMatin: 170,             // secondes réelles
  dureeMatinTuto: 260,
  dureeMidi: 130,             // durée réelle de 11 h à 19 h ; ouvrir plus tôt l'allonge
  heureOuvertureNormale: 11,
  heureFermeture: 19,
  bonusSansAide: 0.10,         // +10 % sur les ventes avec monnaie rendue sans aide
  dureeMenage: 25,
  xpBase: 100,
  xpExposant: 1.5,
  xpFournee: 5,                // × étoiles
  xpGesteManuel: 2,
  xpClient: 8,
  xpMonnaie: 4,
  xpCaisse: 20,
  xpMenage: 15,
  xpCompetenceParNiveau: 15,
  competenceMax: 10,
  seuilRapide: 3,
  clientsBase: 8,
  clientsParEtoile: 4,
  patienceBase: 38,
  reputationInitiale: 2.5,
  tauxBradage: 0.3,
  jourEvenements: 4,
  probaEvenement: 0.25,
  niveauEquipe: 5,
  capitalEmbauche: 80000,
  fraisEmbauche: 10000,
  majorationExpress: 1.3,
  revenuBoutique2: 18000,
  faillite: -50000,
});

/** @param {IngredientId} ingredient @param {number} grammes @returns {Dosage} */
function d(ingredient, grammes) { return { ingredient, grammes }; }

/** @type {Readonly<Record<IngredientId, Ingredient>>} */
const INGREDIENTS = {
  farine:         { id: 'farine', nom: 'Farine T65', prixKg: 95, stockInitial: 15000, lot: 5000, illimite: false },
  farineComplete: { id: 'farineComplete', nom: 'Farine complète T150', prixKg: 140, stockInitial: 0, lot: 5000, illimite: false },
  eau:            { id: 'eau', nom: 'Eau (réseau)', prixKg: 0, stockInitial: 0, lot: 0, illimite: true },
  sel:            { id: 'sel', nom: 'Sel fin', prixKg: 60, stockInitial: 1000, lot: 1000, illimite: false },
  levure:         { id: 'levure', nom: 'Levure fraîche', prixKg: 400, stockInitial: 500, lot: 500, illimite: false },
  lait:           { id: 'lait', nom: 'Lait entier', prixKg: 100, stockInitial: 3000, lot: 5000, illimite: false },

/** @param {number} v @param {number} a @param {number} b @returns {number} */

/** @template T @param {ReadonlyArray<T>} t @param {(v: T) => number} poidsDe @returns {T} */
function choisirPondere(t, poidsDe) {
  let total = 0;
  for (const v of t) total += poidsDe(v);
  let r = Math.random() * total;
  for (const v of t) { r -= poidsDe(v); if (r <= 0) return v; }
  return t[t.length - 1];
}
/** @param {ReadonlyArray<number>} t @returns {number} */

/** @param {Point} a @param {Point} b @returns {number} */
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
/** @param {Point} p @param {ReadonlyArray<Point>} t @returns {number} */
function distMin(p, t) { let m = Infinity; for (const q of t) { const v = dist(p, q); if (v < m) m = v; } return m; }
/** @param {ReadonlyArray<Point>} t @returns {number} */
function longueur(t) { let l = 0; for (let i = 1; i < t.length; i++) l += dist(t[i - 1], t[i]); return l; }
/** @param {ReadonlyArray<Point>} t @param {number} n @returns {Point[]} */
function reechantillonner(t, n) {
  const total = longueur(t);
  if (total === 0 || t.length < 2) return t.slice();
  /** @type {Point[]} */
  const res = [{ x: t[0].x, y: t[0].y }];
  const pas = total / (n - 1);
  let acc = 0;
  let i = 1;
  let prec = t[0];
  while (i < t.length && res.length < n) {
    const seg = dist(prec, t[i]);
    if (acc + seg >= pas) {
      const k = (pas - acc) / seg;
      const p = { x: prec.x + (t[i].x - prec.x) * k, y: prec.y + (t[i].y - prec.y) * k };
      res.push(p);
      prec = p;
      acc = 0;
    } else {
      acc += seg;
      prec = t[i];
      i++;
    }
  }
  const der = t[t.length - 1];
  if (res.length < n) res.push({ x: der.x, y: der.y });
  return res;
}
/** @param {ReadonlyArray<Point>} sommets @returns {Point[]} */
function polygone(sommets) {
  /** @type {Point[]} */
  const pts = [];
  for (let i = 1; i < sommets.length; i++) {
    const a = sommets[i - 1], b = sommets[i];
    for (let k = 0; k < 20; k++) pts.push({ x: a.x + (b.x - a.x) * k / 20, y: a.y + (b.y - a.y) * k / 20 });
  }
  pts.push(sommets[sommets.length - 1]);
  return pts;
}

  for (const p of LISTE_PRODUITS) if (!e.competences[p]) e.competences[p] = { niv: 1, xp: 0 };

  if (typeof e.muet !== 'boolean') e.muet = false;
  if (typeof e.aideMonnaie !== 'boolean') e.aideMonnaie = true;
  if (typeof e.prochainId !== 'number') e.prochainId = 1;
  for (const emp of e.employes.concat(e.candidats)) {
    if (!emp.taches) emp.taches = tachesInitiales(emp.role, emp.competence);

function zoneDoree(c) { return { min: 0.88 - 0.012 * (c - 1), max: 1.04 + 0.008 * (c - 1) }; }
/** @param {number} c */
function noteRapide(c) {

/** @param {number} n */
function gagnerXP(n) {
  if (n <= 0) return;
  E.xp += n;
  S.journal.xp += n;
  while (E.xp >= xpRequise(E.niveau)) {
    E.xp -= xpRequise(E.niveau);
    E.niveau++;
    const gains = ['gestes et minuteries 3 % plus rapides'];
    if (E.niveau === 3 || E.niveau === 6 || E.niveau === 10) gains.push('+1 place de four');
    if (E.niveau === 4) gains.push('+1 place sur le plan de travail');
    if (E.niveau === 5) gains.push('+1 place de pousse', 'recrutement d’employés');
    if ((E.niveau - 1) % 4 === 0) gains.push('fournées ×' + tailleFournee());
    for (const p of LISTE_PRODUITS) if (RECETTES[p].niveau === E.niveau) gains.push('recette : ' + RECETTES[p].nom);
    for (const a of AMELIORATIONS) if (a.niveau === E.niveau) gains.push('travaux : ' + a.nom);
    S.journal.notes.push('Niveau ' + E.niveau + ' : ' + gains.join(', ') + '.');
    toast('Niveau ' + E.niveau + ' ! ' + gains[gains.length - 1]);
    son('niveau');
  }
}
/** @param {ProduitId} p @param {number} n */
function gagnerCompetence(p, n) {
  const c = E.competences[p];
  if (c.niv >= CONFIG.competenceMax) return;
  c.xp += n;
  while (c.niv < CONFIG.competenceMax && c.xp >= CONFIG.xpCompetenceParNiveau * c.niv) {

  }
}

function nombreClients() {

  if (E.evenement === 'marcheNoel') n *= 1.6;
  if (E.jour === 1) n = Math.min(n, 13);

/** @param {number} id @param {number} arrivee @returns {Client} */
function creerClient(id, arrivee) {

  const lignes = dispo.length > 1 && Math.random() < 0.4 ? 2 : 1;
  for (let i = 0; i < lignes; i++) {

    commande.push({ produit: p, qte: Math.max(1, Math.ceil(Math.pow(Math.random(), 1.6) * RECETTES[p].qteMax)) });
  }

  return { id, commande, patience: pat, patienceMax: pat, arrivee, x: -0.15, teinte: choisir(TEINTES), habit: choisir(HABITS),
    humeur: 0.7, erreurs: 0, special: false, sortie: -1 };
}
function preparerJournee() {

/** @returns {EvenementId|null} */
function tirerEvenement() {

  /** @type {EvenementId[]} */

/** @param {RoleId} role @returns {TacheId} */
function tachePrincipale(role) { return role === 'vendeur' ? 'vente' : role === 'plongeur' ? 'menage' : 'pate'; }
/** @param {RoleId} role @param {number} comp @returns {Record<TacheId, Competence>} */
function tachesInitiales(role, comp) {
  const n = (/** @type {TacheId} */ t) => ({ niv: role === 'fournier' ? (t === 'pate' || t === 'four' ? comp : 1) : t === tachePrincipale(role) ? comp : 1, xp: 0 });

}
/** Tâches possibles selon le poste. @param {RoleId} role @returns {TacheId[]} */

function majCompetenceGlobale(e) {

/** @param {Employe} e @returns {StatOuvrier} */
function statOuvrier(e) {

}
/** @param {Employe} e @param {TacheId} t @param {number} n */
function gagnerTache(e, t, n) {

  if (c.niv >= CONFIG.competenceMax) return;

/** Étoiles moyennes attendues pour un niveau de tâche. @param {number} niv */
function etoilesAttendues(niv) { return borner(1 + (niv - 1) / 4.5, 1, 3); }
/** @param {number} niv */
function noteOuvrier(niv) { return borner(Math.round(etoilesAttendues(niv) + entre(-0.5, 0.5)), 1, 3); }
/** @param {TacheId} t @returns {Employe[]} */
function ouvriersSur(t) { return E.employes.filter((e) => !e.enFormation && e.affectation === t && tachesDuRole(e.role).includes(t)); }
/** @param {number} id @param {string} v */
function affecter(id, v) {

  const t = ['pate', 'four', 'vente', 'menage'].find((x) => x === v);
  if (!e || !t) return;

function genererCandidats() {

    E.candidats.push({ id: E.prochainId++, nom: choisir(PRENOMS), role: roles[i], competence: comp,
      potentiel: entier(Math.min(10, comp + 1), 10), salaire: salaireMarche(comp) + entier(-4, 6) * 100,
      moral: 70, enFormation: false, jours: 0, taches: tachesInitiales(roles[i], comp),

/** @param {IngredientId} i @param {number} grammes @param {number} majoration */
function acheter(i, grammes, majoration) {
  const prix = Math.round(grammes * INGREDIENTS[i].prixKg / 1000 * majoration);
  if (E.argent < prix) { toast('Pas assez d’argent pour cet achat.'); son('echec'); return false; }
  E.argent -= prix;
  E.stock[i] += grammes;
  son('piece');
  return true;
}
/** Besoins en grammes pour couvrir la prévision. @returns {Record<IngredientId, number>} */
function besoinsPrevision() {
  const b = parIngredient(() => 0);
  const m = tailleFournee();
  for (const p of produitsDebloques()) {
    const fournees = Math.ceil(S.demande[p] / (RECETTES[p].pieces * m));
    for (const x of RECETTES[p].dosages) b[x.ingredient] += x.grammes * m * fournees;
  }
  return b;
}
/** @param {number} majoration */
function toutCompleter(majoration) {
  const b = besoinsPrevision();
  let total = 0;
  for (const i of LISTE_INGREDIENTS) {
    const ing = INGREDIENTS[i];
    if (ing.illimite) continue;
    const manque = b[i] - E.stock[i];
    if (manque <= 0) continue;
    const lots = Math.ceil(manque / ing.lot);
    if (acheter(i, lots * ing.lot, majoration)) total += lots;
  }
  if (total === 0) toast('La réserve couvre déjà la prévision.');
  else toast('Commande livrée : ' + total + ' lot' + (total > 1 ? 's' : '') + '.');
}

/** @param {ProduitId} p @param {number} m */
function consommer(p, m) {

function ajouterVitrine(p, n, note) {

    vendeurClient: null, vendeurT: 0, ouverture,

  if (enPlus >= 0.25) toast('Ouverture à ' + libelleHeure(ouverture) + ' : ' + nombre(enPlus, 1) + ' h de vente en plus, environ ' + nbExtra + ' client' + (nbExtra > 1 ? 's' : '') + ' de plus.');
  son('clochette');

/** Heure du fournil, de 6 h à 11 h. @returns {number} */
function heureMatin() { return 6 + (CONFIG.heureOuvertureNormale - 6) * borner(S.horloge / S.dureeMatin, 0, 1); }
/** @param {number} h @returns {string} */

/** L'aide affiche le montant à rendre ; elle est imposée pendant les 2 premiers jours du tutoriel. */

function terminerMidi() {

}
/** @param {number} montant @returns {Coupure[]} */
function decomposer(montant) {
  /** @type {Coupure[]} */
  const res = [];
  let reste = montant;
  for (const v of COUPURES) {
    const max = Math.floor(reste / v);
    let n = max;
    if (v >= 500 && max > 0 && Math.random() < 0.5) n = max - 1;
    if (v === 5000 && n > 2) n = 2;
    if (n > 0) res.push({ valeur: v, n });
    reste -= n * v;
  }
  if (reste > 0) {
    const dix = res.find((c) => c.valeur === 10);
    if (dix) dix.n += Math.round(reste / 10); else res.push({ valeur: 10, n: Math.round(reste / 10) });
  }
  return res;
}
function validerCaisse() {

  const v = lireSaisie(K.saisie);
  K.resultat = v === K.attendu;
  S.journal.caisseJuste = K.resultat;

  K.t = 0;
}
/** @param {string} s @returns {number} */
function lireSaisie(s) {
  if (s === '') return -1;
  const [e, c] = s.split(',');
  const ct = c === undefined ? 0 : parseInt((c + '00').slice(0, 2), 10);
  return parseInt(e || '0', 10) * 100 + ct;
}
/** @param {string} t */
function toucheCaisse(t) {

  if (t === ',') { if (!K.saisie.includes(',')) K.saisie = (K.saisie || '0') + ','; return; }
  const dec = K.saisie.split(',')[1];
  if (dec !== undefined && dec.length >= 2) return;
  if (K.saisie.replace(',', '').length >= 7) return;
  K.saisie = K.saisie === '0' ? t : K.saisie + t;
}

/** @param {ProduitId} p */
function raisonImpossible(p) {

  const manque = ingredientManquant(p, tailleFournee());
  if (manque) return 'Il manque : ' + manque + '. Ouvrez la réserve pour commander.';
  return '';
}
/** @param {ProduitId} p */
function lancerFournee(p) {

  const r = RECETTES[p];
  if (!recetteDebloquee(r)) { toast(r.nom + ' : disponible au niveau ' + r.niveau + '.'); return; }
  const raison = raisonImpossible(p);
  if (raison) { toast(raison); son('echec'); return; }

  consommer(p, m);
  S.fournees.push({ id: S.prochaineFournee++, recette: p, mult: m, etape: 0, lieu: 'plan', minuteur: 0, duree: 0, notes: [], manuel: 0, cibleOuvrier: 0 });

}
/** @param {number} id @returns {Fournee|null} */
function trouverFournee(id) { return S.fournees.find((f) => f.id === id) || null; }
/** @param {Fournee} f @param {boolean} rapide */
function faireGeste(f, rapide) {
  if (S.mj) return;
  const et = etapeCourante(f);
  if (!estGeste(et)) return;
  const tr = travailSur(f);
  if (tr) {
    const o = E.employes.find((x) => x.id === tr.emp);
    toast((o ? o.nom : 'Ton ouvrier') + ' s’en occupe déjà.');
    return;
  }
  if (rapide) {
    const c = E.competences[f.recette].niv;
    while (estGeste(etapeCourante(f)) && f.etape < RECETTES[f.recette].etapes.length) {
      f.notes.push(noteRapide(c));

}
/** @param {EtapeId} et @param {Fournee} f @returns {MiniJeu|null} */
function creerMiniJeu(et, f) {
  const base = { fournee: f.id, temps: 0, fini: false, finT: 0, etoiles: 0, texte: '' };
  if (et === 'petrir') return { ...base, type: 'petrir', limite: 12, angle: 0, dernier: null, tours: [], debut: -1, requis: tourDePetrissage() };
  if (et === 'faconner') {
    const forme = RECETTES[f.recette].forme;
    return { ...base, type: 'faconner', limite: 12, forme, chemin: cheminForme(forme), trace: [], actif: false };
  }
  if (et === 'scarifier') return { ...base, type: 'scarifier', limite: 10, trace: [], actif: false, t0: 0 };

}
/** @param {FormeId} forme @returns {Point[]} */
function cheminForme(forme) {
  /** @type {Point[]} */
  const pts = [];
  const N = 120;
  if (forme === 'boudin') for (let i = 0; i <= N; i++) { const t = i / N; pts.push({ x: 0.12 + 0.76 * t, y: 0.5 + 0.08 * Math.sin(t * Math.PI * 2) }); }
  else if (forme === 'ligne') for (let i = 0; i <= N; i++) { const t = i / N; pts.push({ x: 0.16 + 0.68 * t, y: 0.5 }); }
  else if (forme === 'spirale') for (let i = 0; i <= N; i++) { const t = i / N; const a = t * Math.PI * 3.2; const r = 0.05 + 0.27 * t; pts.push({ x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r }); }
  else if (forme === 'cercle') for (let i = 0; i <= N; i++) { const a = (i / N) * Math.PI * 2 - Math.PI / 2; pts.push({ x: 0.5 + Math.cos(a) * 0.32, y: 0.5 + Math.sin(a) * 0.32 }); }
  else if (forme === 'triangle') return reechantillonner(polygone([{ x: 0.5, y: 0.17 }, { x: 0.2, y: 0.8 }, { x: 0.8, y: 0.8 }, { x: 0.5, y: 0.17 }]), 70);
  else return reechantillonner(polygone([{ x: 0.24, y: 0.3 }, { x: 0.76, y: 0.3 }, { x: 0.76, y: 0.7 }, { x: 0.24, y: 0.7 }, { x: 0.24, y: 0.3 }]), 70);
  return reechantillonner(pts, 70);
}
/** @param {MiniJeu} mj @param {number} n @param {string} texte */
function finirMiniJeu(mj, n, texte) {
  if (mj.fini) return;
  mj.fini = true;
  mj.etoiles = n;
  mj.texte = texte;
  son(n >= 3 ? 'succes' : n === 2 ? 'clic' : 'echec');
  const R = rectMJ();
  for (let i = 0; i < 18; i++) ajouterParticule(R.x + R.w / 2, R.y + R.h / 2, n >= 3 ? 'etincelle' : 'farine');
}
function appliquerMiniJeu() {
  const mj = S.mj;
  if (!mj) return;
  const f = trouverFournee(mj.fournee);
  S.mj = null;
  if (!f) return;
  S.travaux = S.travaux.filter((t) => t.fournee !== f.id);
  f.notes.push(mj.etoiles);
  f.etape++;
  f.manuel++;
  gagnerXP(CONFIG.xpGesteManuel);

}
/** @param {MJPetrir} mj */
function evaluerPetrissage(mj) {
  const durees = [];
  for (let i = 0; i < mj.tours.length; i++) durees.push(mj.tours[i] - (i === 0 ? mj.debut : mj.tours[i - 1]));
  const m = moyenne(durees);
  let v = 0;
  for (const x of durees) v += (x - m) * (x - m);
  const cv = m > 0 ? Math.sqrt(v / durees.length) / m : 1;
  const n = cv < 0.2 ? 3 : cv < 0.4 ? 2 : 1;
  finirMiniJeu(mj, n, n === 3 ? 'Rythme parfait !' : n === 2 ? 'Rythme correct' : 'Rythme irrégulier');
}
/** @param {MJFaconner} mj */
function evaluerFaconnage(mj) {
  const tr = mj.trace;
  if (tr.length < 6 || longueur(tr) < 0.35 * longueur(mj.chemin)) { mj.trace = []; mj.texte = 'Tracez tout le geste, sans lever le doigt.'; return; }
  let s = 0;
  for (const p of tr) s += distMin(p, mj.chemin);
  const precision = s / tr.length;
  let couverts = 0;
  for (const q of mj.chemin) if (distMin(q, tr) < 0.055) couverts++;
  const couv = couverts / mj.chemin.length;
  const n = couv >= 0.86 && precision < 0.032 ? 3 : couv >= 0.65 && precision < 0.06 ? 2 : 1;
  finirMiniJeu(mj, n, (n === 3 ? 'Façonnage net !' : n === 2 ? 'Bien façonné' : 'Forme approximative') + ' · ' + Math.round(couv * 100) + ' % du tracé');
}
/** @param {MJScarifier} mj */
function evaluerScarification(mj) {
  const tr = mj.trace;
  if (tr.length < 2) return;
  const a = tr[0], b = tr[tr.length - 1];
  const L = dist(a, b);
  if (L < 0.08) { mj.trace = []; mj.texte = 'Faites un trait d’un seul geste sur la pâte.'; return; }
  let dev = 0;
  for (const p of tr) {
    const v = Math.abs((b.x - a.x) * (a.y - p.y) - (a.x - p.x) * (b.y - a.y)) / L;
    if (v > dev) dev = v;
  }
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  const ideal = -22;
  let diff = Math.abs(((ang - ideal) % 180 + 180) % 180);
  diff = Math.min(diff, 180 - diff);
  const milieu = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  const centre = dist(milieu, { x: 0.5, y: 0.5 }) < 0.18;
  const duree = mj.temps - mj.t0;
  const n = L >= 0.3 && dev < 0.025 && diff < 12 && centre && duree < 1.3 ? 3 : L >= 0.2 && dev < 0.055 && diff < 25 ? 2 : 1;
  finirMiniJeu(mj, n, n === 3 ? 'Coup de lame net !' : n === 2 ? 'Belle grigne' : 'Trait hésitant');
}
/** @param {Fournee} f */
function defourner(f) {

}
/** @param {Fournee} f */
function terminerFournee(f) {

/** @param {Fournee} f @returns {TravailOuvrier|null} */

function majOuvriers(dt) {

    if (tr) {

      if (!f || !estGeste(etapeCourante(f))) { S.travaux = S.travaux.filter((t) => t !== tr); continue; }

        st.actions++;
        st.notes.push(n);

      }

        gagnerTache(e, 'four', 1 + f.notes[f.notes.length - 1]);
        toast(e.nom + ' défourne : ' + RECETTES[f.recette].pluriel + ' ' + etoiles(f.notes[f.notes.length - 1]) + '.');

}

/** @param {EtatComptoir} C @returns {Client|null} */
function clientJoueur(C) { return C.clients.find((c) => c !== C.vendeurClient) || null; }
/** @param {Client} cl @param {number} satisfaction @param {'servi'|'perdu'|'rupture'|'ferme'} raison */
function partir(cl, satisfaction, raison) {
  const C = S.comptoir;
  if (!C) return;
  C.clients = C.clients.filter((c) => c !== cl);
  if (C.vendeurClient === cl) C.vendeurClient = null;
  cl.humeur = satisfaction;
  cl.sortie = 0;
  C.sortants.push(cl);
  if (raison !== 'ferme') S.journal.satisfactions.push(satisfaction);
  if (raison === 'perdu') { S.journal.clientsPerdus++; dire('Un client est parti, lassé d’attendre.'); son('echec'); }
  if (raison === 'ferme') S.journal.clientsPerdus++;
  for (const p of LISTE_PRODUITS) C.plateau[p] = Math.min(C.plateau[p], S.vitrine[p].length);
}
/** @param {string} t */
function dire(t) { const C = S.comptoir; if (C) { C.message = t; C.messageT = 2.6; } }
/** @param {ProduitId} p */
function ajouterPlateau(p) {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  if (C.plateau[p] >= S.vitrine[p].length) { dire('Plus de ' + RECETTES[p].nom.toLowerCase() + ' en vitrine.'); son('echec'); return; }
  C.plateau[p]++;
  son('clic');
}
/** @param {ProduitId} p */
function retirerPlateau(p) {
  const C = S.comptoir;
  if (!C || C.paiement || C.plateau[p] <= 0) return;
  C.plateau[p]--;
  son('clic');
}
function servir() {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  const cl = clientJoueur(C);
  if (!cl) return;
  let partiel = false;
  let nbPlateau = 0;
  let dispoCommande = 0;
  for (const p of LISTE_PRODUITS) {
    const ligne = cl.commande.find((l) => l.produit === p);
    const cmd = ligne ? ligne.qte : 0;
    const pl = C.plateau[p];
    const dispo = S.vitrine[p].length;
    nbPlateau += pl;
    dispoCommande += Math.min(cmd, dispo);
    if (pl > cmd) { erreurService(cl, cmd === 0 ? 'Je n’ai pas demandé de ' + RECETTES[p].nom.toLowerCase() + ' !' : 'Trop de ' + RECETTES[p].pluriel + ' !'); return; }
    if (pl < Math.min(cmd, dispo)) { erreurService(cl, 'Il manque ' + (Math.min(cmd, dispo) - pl) + ' ' + (cmd - pl > 1 ? RECETTES[p].pluriel : RECETTES[p].nom.toLowerCase()) + '.'); return; }
    if (pl < cmd) partiel = true;
  }
  if (nbPlateau === 0) {
    if (dispoCommande > 0) { erreurService(cl, 'Vous ne me servez rien ?'); return; }
    rupture();
    return;
  }
  let total = 0;
  /** @type {number[]} */
  const notes = [];
  for (const p of LISTE_PRODUITS) {
    for (let i = 0; i < C.plateau[p]; i++) {
      const prod = S.vitrine[p].shift();
      if (!prod) continue;
      total += prod.prix;
      notes.push(prod.etoiles);
      S.journal.ventes[p]++;
    }
    C.plateau[p] = 0;
  }
  if (cl.special) total = Math.round(total * 1.2 / 10) * 10;
  let donne = total;
  if (Math.random() > 0.3) {
    const billets = [500, 1000, 2000, 5000];
    donne = billets.find((b) => b > total) || Math.ceil(total / 1000) * 1000 + 1000;
  }
  const pay = { client: cl, total, donne, rendu: 0, partiel, qualite: moyenne(notes) };
  son('piece');
  if (donne === total) { encaisser(pay, true); return; }
  C.paiement = pay;
}
/** @param {Client} cl @param {string} texte */
function erreurService(cl, texte) {

  cl.patience -= cl.patienceMax * 0.12;
  dire(texte);
  son('echec');
}
function rupture() {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  const cl = clientJoueur(C);
  if (!cl) return;
  const disponible = cl.commande.some((l) => S.vitrine[l.produit].length - C.plateau[l.produit] > 0);
  for (const p of LISTE_PRODUITS) C.plateau[p] = 0;

}
/** @param {number} v */
function ajouterMonnaie(v) {

}
function effacerMonnaie() { const C = S.comptoir; if (C && C.paiement) { C.paiement.rendu = 0; son('clic'); } }
function rendreMonnaie() {
  const C = S.comptoir;
  if (!C || !C.paiement) return;
  const pay = C.paiement;
  const du = pay.donne - pay.total;
  if (pay.rendu === du) { encaisser(pay, true); return; }
  if (pay.rendu < du) {
    dire('Il manque ' + euros(du - pay.rendu) + ' sur ma monnaie.');
    pay.rendu = du;
    encaisser(pay, false);
  } else {

  }
}
/** @param {Paiement} pay @param {boolean} monnaieOk */
function encaisser(pay, monnaieOk) {

  const net = pay.donne - (pay.donne === pay.total ? 0 : pay.rendu);
  E.argent += net;
  S.journal.ca += net;
  const cl = pay.client;
  const sat = borner(1 - 0.35 * (1 - cl.patience / cl.patienceMax) - 0.15 * cl.erreurs - (pay.partiel ? 0.25 : 0) -
    (monnaieOk ? 0 : 0.1) + (pay.qualite - 2) * 0.12, 0, 1);
  S.journal.clientsServis++;
  gagnerXP(CONFIG.xpClient + (monnaieOk && pay.donne !== pay.total ? CONFIG.xpMonnaie : 0));
  C.paiement = null;
  if (monnaieOk && pay.donne !== pay.total && !aideMonnaieActive()) {
    const bonus = Math.round(pay.total * CONFIG.bonusSansAide / 10) * 10;
    E.argent += bonus;
    S.journal.bonusCalcul += bonus;

  partir(cl, sat, 'servi');
  const R = rectsComptoir.boutique;

/** @param {number} dt */
function majComptoir(dt) {
  const C = S.comptoir;
  if (!C) return;
  C.temps += dt;
  if (C.messageT > 0) C.messageT -= dt;
  while (!C.fermeture && C.aVenir.length && C.aVenir[0].arrivee <= C.temps) {
    const cl = C.aVenir.shift();
    if (cl) { C.clients.push(cl); son('clochette'); }
  }
  for (const cl of C.clients.slice()) {
    if (C.paiement && C.paiement.client === cl) continue;
    if (cl === C.vendeurClient) continue;
    cl.patience -= dt;
    if (cl.patience <= 0) partir(cl, 0, 'perdu');
  }
  // Vendeur
  const vendeurs = presents('vendeur');
  if (vendeurs.length) {
    const v = vendeurs[0];
    if (C.vendeurClient) {
      C.vendeurT -= dt;
      if (C.vendeurT <= 0) servirParVendeur(C, C.vendeurClient, v);
    } else {
      C.vendeurT -= dt;
      const joueur = clientJoueur(C);
      const candidat = C.clients.find((c) => c !== joueur);
      if (candidat && C.vendeurT <= 0) {
        if (Math.random() < 0.55 + 0.05 * v.taches.vente.niv) { C.vendeurClient = candidat; C.vendeurT = 4.6 - 0.25 * v.taches.vente.niv; }
        else C.vendeurT = 2;
      }
    }
  }
  for (const s of C.sortants) s.sortie += dt;
  C.sortants = C.sortants.filter((s) => s.sortie < 1.6);
  if (C.temps >= C.duree && C.aVenir.length) C.aVenir = [];
  if (C.aVenir.length === 0 && C.clients.length === 0 && !C.paiement) {

    if (C.finT > 1.4) terminerMidi();

}
/** @param {EtatComptoir} C @param {Client} cl @param {Employe} v */
function servirParVendeur(C, cl, v) {
  let total = 0;

    const n = Math.max(0, Math.min(l.qte, libres));

      if (prod) { total += prod.prix; S.journal.ventes[l.produit]++; }
    }
  }
  C.vendeurClient = null;
  C.vendeurT = 1.5;
  const st = statOuvrier(v);
  const niv = v.taches.vente.niv;
  if (total === 0) { partir(cl, 0.4, 'rupture'); gagnerTache(v, 'vente', 1); return; }
  // Vente additionnelle : plus le vendeur est expérimenté, plus il en propose.
  if (Math.random() < 0.08 + 0.05 * niv) {
    const p = choisirPondere(produitsDebloques(), (q) => RECETTES[q].popularite);
    const libres = S.vitrine[p].length - C.plateau[p];
    if (libres > 0) {
      const prod = S.vitrine[p].pop();
      if (prod) {
        total += prod.prix;
        S.journal.ventes[p]++;
        st.ventesAdd++;
        st.caAdd += prod.prix;
        gagnerTache(v, 'vente', 2);
        dire('Vente additionnelle de ' + v.nom + ' : 1 ' + RECETTES[p].nom.toLowerCase().replace(' (part)', '') + ' en plus !');
        son('piece');
      }
    } else {
      st.manquees++;
      dire(v.nom + ' aurait vendu 1 ' + RECETTES[p].nom.toLowerCase().replace(' (part)', '') + ' de plus : rupture !');
    }
  }
  st.actions++;
  gagnerTache(v, 'vente', 1);
  if (cl.special) total = Math.round(total * 1.2 / 10) * 10;
  E.argent += total;
  S.journal.ca += total;
  S.journal.clientsServis++;
  gagnerXP(Math.round(CONFIG.xpClient / 2));
  partir(cl, borner(0.55 + 0.04 * niv, 0, 1), 'servi');
}

/** @param {number} f @param {number} duree @param {OscillatorType} type @param {number} vol @param {number} retard @param {number} [fin] */

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  o.connect(g).connect(audio.destination);

  o.stop(t + duree + 0.02);

/** @param {number} duree @param {number} vol @param {number} freq */
function bruit(duree, vol, freq) {
  if (!audio) return;
  const n = Math.floor(audio.sampleRate * duree);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audio.createBufferSource();
  src.buffer = buf;
  const filtre = audio.createBiquadFilter();
  filtre.type = 'bandpass';
  filtre.frequency.value = freq;

/** @type {Particule[]} */
let particules = [];
const MAX_PARTICULES = 150;
/** @param {number} x @param {number} y @param {TypeParticule} type */
function ajouterParticule(x, y, type) {
  if (particules.length >= MAX_PARTICULES) particules.shift();
  const a = Math.random() * Math.PI * 2;
  const v = type === 'fumee' || type === 'vapeur' ? entre(10, 30) : entre(40, 150);
  particules.push({ x, y, vx: Math.cos(a) * v, vy: type === 'fumee' || type === 'vapeur' ? -entre(20, 50) : Math.sin(a) * v - 40,
    vie: 0, max: type === 'fumee' ? 1.8 : entre(0.5, 1.1), taille: type === 'fumee' ? entre(6, 14) : entre(2, 5), type });
}
/** @param {number} dt */
function majParticules(dt) {
  for (const p of particules) {
    p.vie += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 'farine' || p.type === 'piece' || p.type === 'etincelle') p.vy += 220 * dt;
    if (p.type === 'fumee' || p.type === 'vapeur') { p.taille += 10 * dt; p.vx *= 0.98; }
  }
  particules = particules.filter((p) => p.vie < p.max);
}
function dessinerParticules() {
  for (const p of particules) {
    const a = 1 - p.vie / p.max;
    ctx.globalAlpha = Math.max(0, a);
    if (p.type === 'farine') ctx.fillStyle = '#fffdf6';
    else if (p.type === 'fumee') ctx.fillStyle = 'rgba(70,60,55,0.55)';
    else if (p.type === 'vapeur') ctx.fillStyle = 'rgba(255,255,255,0.5)';
    else if (p.type === 'piece') ctx.fillStyle = '#f2c14e';
    else if (p.type === 'bulle') ctx.fillStyle = 'rgba(200,230,255,0.8)';
    else ctx.fillStyle = '#ffd35c';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.taille, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** @param {EtatComptoir} C @param {Client} cl @param {number} x @param {number} yBas @param {Rect} R */

/** @param {number} v @param {number} x @param {number} y @param {number} s */

/** @param {Coupure[]} liste @param {Rect} R @param {boolean} billets */
function dessinerCasiers(liste, R, billets) {
  const valeurs = billets ? [5000, 2000, 1000, 500] : [200, 100, 50, 20, 10];
  const n = valeurs.length;
  const g = 4;
  const w = (R.w - g * (n - 1)) / n;
  valeurs.forEach((v, i) => {
    const r = { x: R.x + i * (w + g), y: R.y, w, h: R.h };
    rr(ctx, r.x, r.y, r.w, r.h, 6);
    ctx.fillStyle = '#3a2414';
    ctx.fill();
    ecrire(v >= 100 ? (v / 100) + ' €' : v + ' c', r.x + r.w / 2, r.y + 9, 10, '#c9a775', 'center', 700);
    const c = liste.find((x) => x.valeur === v);
    const nb = c ? c.n : 0;
    if (nb === 0) return;
    const zy = r.y + 18, zh = r.h - 22;
    if (billets) {
      const bw = r.w * 0.86, bh = Math.min(zh * 0.45, bw * 0.55);
      const pas = nb > 1 ? Math.min(bh * 0.55, (zh - bh) / (nb - 1)) : 0;
      for (let k = 0; k < nb; k++) dessinerArgent(v, r.x + r.w / 2, zy + bh / 2 + k * pas, bw / 1.1);
    } else {
      let rad = Math.min(r.w * 0.2, zh * 0.18);
      let parLigne = Math.max(1, Math.floor((r.w - 4) / (2 * rad + 3)));
      let lignes = Math.ceil(nb / parLigne);
      if (lignes * (2 * rad + 3) > zh) {
        rad = Math.max(4, (Math.sqrt((r.w - 4) * zh / nb) - 3) / 2);
        parLigne = Math.max(1, Math.floor((r.w - 4) / (2 * rad + 3)));

      for (let k = 0; k < nb; k++) {

      }
    }
  });
}

// ---- Ménage ----
/** @param {number} i @returns {Rect} */
function rectZoneMenage(i) {
  const p = 8;
  if (estPortrait()) { const h = (H - 50 - p * 4) / 3; return { x: p, y: 44 + p + i * (h + p), w: W - 2 * p, h }; }
  const w = (W - p * 4) / 3;
  return { x: p + i * (w + p), y: 44 + p, w, h: H - 44 - 2 * p };
}
function dessinerMenage() {
  const M = S.menage;
  if (!M) return;
  fondFournil();
  let reste = 0;
  for (const t of M.taches) reste += t.sale;
  const pr = M.taches.length ? 1 - reste / M.taches.length : 1;
  ecrire('Ménage · propreté ' + Math.round(pr * 100) + ' % · ' + Math.max(0, Math.ceil(M.duree - M.temps)) + ' s', W / 2, 22, 17, '#3a2414', 'center', 800, W - 16);
  const noms = ['Sol', 'Comptoir', 'Four'];
  for (let i = 0; i < 3; i++) {
    const r = rectZoneMenage(i);
    rr(ctx, r.x, r.y, r.w, r.h, 12);
    if (i === 0) {
      ctx.fillStyle = '#e9e1d3'; ctx.fill();
      ctx.save(); rr(ctx, r.x, r.y, r.w, r.h, 12); ctx.clip();
      for (let x = r.x; x < r.x + r.w; x += 36) for (let y = r.y; y < r.y + r.h; y += 36) if (((x - r.x) / 36 + (y - r.y) / 36) % 2 < 1) { ctx.fillStyle = '#d7cbb7'; ctx.fillRect(x, y, 36, 36); }
      ctx.restore();
    } else if (i === 1) { ctx.fillStyle = '#b07a48'; ctx.fill(); }
    else { ctx.fillStyle = '#6d625c'; ctx.fill(); }
    ecrire(noms[i], r.x + 12, r.y + 14, 13, i === 2 ? '#f1e0bf' : '#3a2414', 'left', 800);
  }
  for (const t of M.taches) {
    if (t.sale <= 0.02) continue;
    const r = rectZoneMenage(t.zone);
    const rad = t.nr * Math.min(r.w, r.h);
    ctx.globalAlpha = t.sale * 0.85;
    ctx.fillStyle = t.zone === 2 ? '#2a1c12' : t.zone === 1 ? '#f4ead8' : '#8a6a48';
    ctx.beginPath();
    const cx = r.x + t.nx * r.w, cy = r.y + t.ny * r.h;
    for (let k = 0; k <= 10; k++) {
      const a = (k / 10) * Math.PI * 2;
      const rr2 = rad * (0.8 + 0.25 * Math.sin(a * 3 + t.nx * 10));
      if (k === 0) ctx.moveTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2); else ctx.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (pointeur.bas) {
    ctx.fillStyle = '#f2d24a';
    rr(ctx, pointeur.x - 22, pointeur.y - 14, 44, 28, 8);
    ctx.fill();
    ctx.fillStyle = '#4f8a45';
    rr(ctx, pointeur.x - 22, pointeur.y - 14, 44, 9, 4);
    ctx.fill();
  }
}
/** @param {number} x @param {number} y @param {number} dl */
function frotter(x, y, dl) {
  const M = S.menage;
  if (!M || M.fini) return;
  let touche = false;
  for (const t of M.taches) {
    if (t.sale <= 0) continue;
    const r = rectZoneMenage(t.zone);
    const rad = t.nr * Math.min(r.w, r.h);
    const cx = r.x + t.nx * r.w, cy = r.y + t.ny * r.h;
    if (Math.hypot(x - cx, y - cy) < rad * 1.25) {
      t.sale = Math.max(0, t.sale - dl / (rad * 2.4));
      touche = true;
      if (Math.random() < 0.3) ajouterParticule(x, y, 'bulle');
      if (t.sale <= 0) { for (let i = 0; i < 6; i++) ajouterParticule(cx, cy, 'etincelle'); son('clic'); }
    }
  }
  if (touche) son('frotte');
  if (M.taches.every((t) => t.sale <= 0)) terminerMenage();
}

// ---- Accueil ----
function dessinerDevanture() {

    ctx.fillStyle = i % 2 ? '#fbf3e3' : '#b94a35';

  }

  ctx.fillStyle = '#fff2d2';
  ctx.fill();
  ctx.strokeStyle = '#7a4c28';
  ctx.lineWidth = 6;
  ctx.stroke();
  /** @type {ProduitId[]} */
  const deco = ['baguette', 'croissant', 'painChoc', 'tradition', 'eclair', 'tarte'];
  deco.forEach((p, i) => dessinerProduit(ctx, p, vit.x + vit.w * (0.2 + (i % 3) * 0.3), vit.y + vit.h * (0.32 + Math.floor(i / 3) * 0.4), vit.w * 0.22, 1));
  ctx.fillStyle = '#7a4c28';
  rr(ctx, fx + fw * 0.68, fy + fh * 0.36, fw * 0.26, fh * 0.64, 6);

  ctx.fillStyle = '#cfe6ee';
  rr(ctx, fx + fw * 0.71, fy + fh * 0.4, fw * 0.2, fh * 0.25, 4);

    h += '<div class="ligne' + (ok || fait ? '' : ' verrou') + '"><div>' + (fait ? '✅' : ok ? '🔨' : '🔒') + '</div><div><b>' + a.nom + '</b><span class="dosage">' + a.effet + '</span></div><div class="act">' +
      (fait ? '<span class="pos">Installé</span>' : ok ? btn('travaux', a.id, euros(a.prix), 'petit', E.argent < a.prix) : '<span class="discret">Niveau ' + a.niveau + '</span>') + '</div></div>';
  }
  return h + '</div>';
}

  let h = '<div class="carte"><h2>Bilan du jour ' + E.jour + '</h2>';

    '<tr class="total"><td>Bénéfice du jour</td><td class="' + (B.benefice >= 0 ? 'pos' : 'neg') + '">' + euros(B.benefice) + '</td></tr></table>';

  h += '<div class="grille2"><div class="stat">Clients servis<b>' + J.clientsServis + ' / ' + (J.clientsServis + J.clientsPerdus) + '</b></div>' +
    '<div class="stat">Satisfaction<b>' + sat + ' %</b></div>' +
    '<div class="stat">Ouverture<b>' + libelleHeure(J.heureOuverture) + ' → ' + CONFIG.heureFermeture + 'h00</b></div>' +
    '<div class="stat">Réputation<b>' + nombre(B.repAvant, 1) + ' → ' + nombre(B.repApres, 1) + ' ★</b></div>' +
    '<div class="stat">Propreté<b>' + Math.round(J.proprete * 100) + ' %</b></div>' +
    '<div class="stat">Caisse<b>' + (J.caisseJuste ? 'Juste ✅' : 'Erreur ❌') + '</b></div>' +
    '<div class="stat">XP gagnée<b>+' + J.xp + ' · niv. ' + E.niveau + '</b><div class="mini"><i style="width:' + Math.round(100 * E.xp / xpRequise(E.niveau)) + '%"></i></div></div></div>';
  if (J.ouvriers.length) {
    h += '<h3>Ton équipe aujourd’hui</h3><ul>';
    for (const o of J.ouvriers) {
      const e = E.employes.find((x) => x.id === o.id);
      const niv = e ? ' · niveau ' + e.taches[o.tache].niv : '';
      if (o.tache === 'vente') h += '<li>' + esc(o.nom) + ' (vente) : ' + o.actions + ' client' + (o.actions > 1 ? 's' : '') + ' servi' + (o.actions > 1 ? 's' : '') + ', ' + o.ventesAdd + ' vente' + (o.ventesAdd > 1 ? 's' : '') + ' additionnelle' + (o.ventesAdd > 1 ? 's' : '') + ' (+' + euros(o.caAdd) + ')' +
        (o.manquees ? ', <span class="neg">' + o.manquees + ' manquée' + (o.manquees > 1 ? 's' : '') + ' faute de stock : produis plus !</span>' : '') + niv + '</li>';
      else if (o.tache === 'menage') h += '<li>' + esc(o.nom) + ' (ménage) : a nettoyé avant toi' + niv + '</li>';
      else h += '<li>' + esc(o.nom) + ' (' + NOM_TACHE[o.tache].toLowerCase() + ') : ' + o.actions + ' tâche' + (o.actions > 1 ? 's' : '') + (o.notes.length ? ', moyenne ' + etoiles(moyenne(o.notes)) : '') + niv + '</li>';
    }

  }
  if (B.notes.length) h += '<h3>Progrès et événements</h3><ul>' + B.notes.map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul>';
  h += '<p><b>Trésorerie : ' + euros(E.argent) + '</b>' + (E.argent < 0 ? ' · <span class="neg">Attention : sous ' + euros(CONFIG.faillite) + ', c’est la faillite.</span>' : '') + '</p>';
  if (E.jour === 3 && E.tutoriel) h += '<p class="alerte">Fin du tutoriel : Jean-Baptiste te laisse les clés. Pense à passer nous voir à la boulangerie Chez les voisins, à Frontignan !</p>';

}
function htmlFaillite() {
  return '<div class="carte titre-accueil"><h1>Faillite</h1><p>La trésorerie est passée sous ' + euros(CONFIG.faillite) + ' au soir du jour ' + E.jour + '.</p><p>Vous avez atteint le niveau ' + E.niveau + '. Retentez votre chance : surveillez les invendus et les salaires.</p></div>';
}

/** @param {string} a @param {string} v */
function actionUI(a, v) {
  initAudio();
  son('clic');
  switch (a) {
    case 'continuer': continuerPartie(); return;
    case 'confirmerNouvelle': S.confirmer = true; break;
    case 'nouvelle': nouvellePartie(v !== 'sansTuto'); return;
    case 'commencer': demarrerMatin(); return;
    case 'onglet': if (v === 'jour' || v === 'reserve' || v === 'recettes' || v === 'equipe' || v === 'travaux') S.onglet = v; break;
    case 'acheter': {
      const [i, n, maj] = v.split(':');
      const ing = LISTE_INGREDIENTS.find((x) => x === i);
      if (ing) acheter(ing, INGREDIENTS[ing].lot * Number(n), Number(maj));
      break;
    }
    case 'completer': toutCompleter(Number(v)); break;
    case 'express': S.reserveExpress = !S.reserveExpress; break;
    case 'fermerExpress': S.reserveExpress = false; break;
    case 'ouvrir':
      if (!S.confirmer && S.fournees.length > 0) { S.confirmer = true; toast('Des fournées sont en cours : celles au four seront sorties, les autres perdues.'); break; }
      ouvrirBoutique(); return;
    case 'fermer': {
      const C = S.comptoir;
      if (C && !S.confirmer && (C.clients.length > 0 || C.aVenir.length > 0)) { S.confirmer = true; toast('Des clients attendent encore. Touchez à nouveau pour fermer.'); break; }
      fermerBoutique(); return;
    }
    case 'finMenage': terminerMenage(); return;
    case 'suivante': journeeSuivante(); return;
    case 'fermerMenu': S.menu = false; S.confirmer = false; break;
    case 'muet': E.muet = !E.muet; sauver(); break;
    case 'aide': E.aideMonnaie = !E.aideMonnaie; sauver(); toast(E.aideMonnaie ? 'Aide au rendu de monnaie activée.' : 'Aide désactivée : +' + Math.round(CONFIG.bonusSansAide * 100) + ' % sur les ventes rendues juste.'); break;
    case 'embaucher': embaucher(Number(v)); return;
    case 'former': { const [id, t] = v.split(':'); former(Number(id), t); return; }
    case 'affecter': { const [id, t] = v.split(':'); affecter(Number(id), t); break; }
    case 'augmenter': augmenter(Number(v)); return;
    case 'licencier': licencier(Number(v)); return;
    case 'travaux': {
      const am = AMELIORATIONS.find((x) => x.id === v);
      if (am) acheterAmelioration(am.id);
      return;
    }
  }
  if (S.phase === 'preparation') sauver();
  rafraichirUI();
}
document.addEventListener('click', (ev) => {
  const t = ev.target;
  if (!(t instanceof Element)) return;
  const b = t.closest('[data-a]');
  if (!(b instanceof HTMLElement) || (b instanceof HTMLButtonElement && b.disabled)) return;
  actionUI(b.dataset.a || '', b.dataset.v || '');
});
bMuet.addEventListener('click', () => { initAudio(); E.muet = !E.muet; sauver(); majHUD(); if (S.menu) rafraichirPanneau(); });
bMenu.addEventListener('click', () => { initAudio(); basculerMenu(); });
function basculerMenu() {
  if (S.phase === 'accueil') return;
  S.menu = !S.menu;
  S.confirmer = false;
  rafraichirUI();
}
bulleOk.addEventListener('click', () => { terminerEtapeTuto(); });
bullePasser.addEventListener('click', () => { E.tutoriel = false; terminerEtapeTuto(); sauver(); toast('Tutoriel désactivé.'); });

// =====================================================================
// 19. ENTRÉES (pointeur et clavier)
// =====================================================================
/** @typedef {{x: number, y: number, bas: boolean, departX: number, departY: number, zone: Zone|null, glisse: ProduitId|null, id: number}} Pointeur */
/** @type {Pointeur} */
const pointeur = { x: 0, y: 0, bas: false, departX: 0, departY: 0, zone: null, glisse: null, id: -1 };
/** @param {PointerEvent} ev @returns {Point} */
function posLocale(ev) { const r = toile.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
/** @param {Point} p @returns {Zone|null} */
function zoneSous(p) {
  for (let i = zones.length - 1; i >= 0; i--) if (dans(zones[i].r, p.x, p.y, 2)) return zones[i];
  return null;
}
/** @param {Point} p @returns {Point} */
function normMJ(p) { const R = rectMJ(); return { x: (p.x - R.x) / R.w, y: (p.y - R.y) / R.h }; }
toile.addEventListener('pointerdown', (ev) => {
  initAudio();
  if (pointeur.bas && ev.pointerId !== pointeur.id) return;
  const p = posLocale(ev);
  try { toile.setPointerCapture(ev.pointerId); } catch (err) { /* rien */ }
  pointeur.bas = true; pointeur.id = ev.pointerId;
  pointeur.x = p.x; pointeur.y = p.y; pointeur.departX = p.x; pointeur.departY = p.y;
  pointeur.zone = null; pointeur.glisse = null;
  if (enPause()) return;
  const mj = S.mj;
  if (mj && S.phase === 'matin') { mjBas(mj, normMJ(p)); return; }
  pointeur.zone = zoneSous(p);
  if (pointeur.zone && pointeur.zone.glisser) pointeur.glisse = pointeur.zone.glisser;
});
toile.addEventListener('pointermove', (ev) => {
  if (!pointeur.bas || ev.pointerId !== pointeur.id) return;
  const p = posLocale(ev);
  const dl = Math.hypot(p.x - pointeur.x, p.y - pointeur.y);
  pointeur.x = p.x; pointeur.y = p.y;
  if (enPause()) return;
  const mj = S.mj;
  if (mj && S.phase === 'matin') { mjBouge(mj, normMJ(p)); return; }
  if (S.phase === 'menage') frotter(p.x, p.y, dl);
});
/** @param {PointerEvent} ev */
function finPointeur(ev) {
  if (!pointeur.bas || ev.pointerId !== pointeur.id) return;
  const p = posLocale(ev);
  pointeur.bas = false;
  const z = pointeur.zone;
  const glisse = pointeur.glisse;
  pointeur.zone = null; pointeur.glisse = null;
  if (enPause()) return;
  const mj = S.mj;
  if (mj && S.phase === 'matin') { mjHaut(mj); return; }
  if (glisse && S.phase === 'midi' && dans(rectsComptoir.plateau, p.x, p.y)) { ajouterPlateau(glisse); return; }
  if (z && dans(z.r, p.x, p.y, 8)) z.action();
}
toile.addEventListener('pointerup', finPointeur);
toile.addEventListener('pointercancel', (ev) => { if (ev.pointerId === pointeur.id) { pointeur.bas = false; pointeur.zone = null; pointeur.glisse = null; const mj = S.mj; if (mj) mjHaut(mj); } });
toile.addEventListener('contextmenu', (ev) => ev.preventDefault());

/** @param {MiniJeu} mj @param {Point} q */
function mjBas(mj, q) {
  if (mj.fini) return;
  if (mj.type === 'petrir') { mj.dernier = null; mjBouge(mj, q); }
  else if (mj.type === 'faconner') { mj.trace = [q]; mj.actif = true; mj.texte = ''; }
  else { mj.trace = [q]; mj.actif = true; mj.t0 = mj.temps; mj.texte = ''; son('coupe'); }
}
/** @param {MiniJeu} mj @param {Point} q */
function mjBouge(mj, q) {
  if (mj.fini) return;
  if (mj.type === 'petrir') {
    const dx = q.x - 0.5, dy = q.y - 0.5;
    if (Math.hypot(dx, dy) < 0.08) { mj.dernier = null; return; }
    const a = Math.atan2(dy, dx);
    if (mj.dernier !== null) {
      let da = a - mj.dernier;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (mj.debut < 0) mj.debut = mj.temps;
      mj.angle += da;
      if (Math.abs(mj.angle) >= Math.PI * 2 * (mj.tours.length + 1)) {
        mj.tours.push(mj.temps);
        son('pate');
        if (mj.tours.length >= mj.requis) evaluerPetrissage(mj);
      }
      if (Math.random() < 0.25) { const R = rectMJ(); ajouterParticule(R.x + q.x * R.w, R.y + q.y * R.h, 'farine'); }
    }
    mj.dernier = a;
  } else if (mj.actif) {
    const der = mj.trace[mj.trace.length - 1];
    if (!der || dist(der, q) > 0.004) mj.trace.push(q);
  }
}
/** @param {MiniJeu} mj */
function mjHaut(mj) {
  if (mj.fini) return;
  if (mj.type === 'petrir') { mj.dernier = null; return; }
  if (!mj.actif) return;
  mj.actif = false;
  if (mj.type === 'faconner') evaluerFaconnage(mj); else evaluerScarification(mj);
}
/** Geste au clavier (accessibilité). @param {MiniJeu} mj */
function mjClavier(mj) {
  if (mj.fini) return;
  if (mj.type === 'petrir') {
    if (mj.debut < 0) { mj.debut = mj.temps; son('pate'); return; }
    mj.tours.push(mj.temps);
    mj.angle += Math.PI * 2;
    son('pate');
    if (mj.tours.length >= mj.requis) evaluerPetrissage(mj);
  } else {
    if (mj.type === 'faconner') mj.trace = mj.chemin.slice();
    else mj.trace = [{ x: 0.3, y: 0.58 }, { x: 0.7, y: 0.42 }];
    finirMiniJeu(mj, 2, 'Geste au clavier');
  }
}
document.addEventListener('keydown', (ev) => {
  if (ev.target instanceof HTMLInputElement) return;
  initAudio();
  if (ev.key === 'Escape') { basculerMenu(); return; }
  if (enPause()) return;
  if (S.phase === 'matin') {
    if (S.mj) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); mjClavier(S.mj); } return; }
    const n = Number(ev.key);
    if (n >= 1 && n <= 8) { const p = produitsDebloques()[n - 1]; if (p) lancerFournee(p); return; }
    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      const four = S.fournees.find((f) => f.lieu === 'four' && f.minuteur / f.duree >= zoneDoree(E.competences[f.recette].niv).min);
      if (four) { defourner(four); return; }
      const g = S.fournees.find((f) => estGeste(etapeCourante(f)));
      if (g) faireGeste(g, ev.shiftKey && rapideDispo(g.recette));
    }
  } else if (S.phase === 'midi' && S.comptoir) {
    const C = S.comptoir;
    if (C.paiement) {
      /** @type {Record<string, number>} */
      const tch = { '1': 500, '2': 200, '3': 100, '4': 50, '5': 20, '6': 10 };
      const v = tch[ev.key];
      if (v) ajouterMonnaie(v);
      else if (ev.key === 'Enter') rendreMonnaie();
      else if (ev.key === 'Backspace') effacerMonnaie();
      return;
    }
    const n = Number(ev.key);
    if (n >= 1 && n <= 8) { const p = produitsDebloques()[n - 1]; if (p) ajouterPlateau(p); }
    else if (ev.key === 'Enter') servir();
    else if (ev.key === 'Backspace') { const p = LISTE_PRODUITS.find((x) => C.plateau[x] > 0); if (p) retirerPlateau(p); }
    else if (ev.key === 'r' || ev.key === 'R') rupture();
  } else if (S.phase === 'caisse') {
    if (/^[0-9]$/.test(ev.key)) toucheCaisse(ev.key);
    else if (ev.key === ',' || ev.key === '.') toucheCaisse(',');
    else if (ev.key === 'Backspace') toucheCaisse('⌫');
    else if (ev.key === 'Enter') validerCaisse();
  } else if (S.phase === 'menage') {
    if (ev.key === ' ') {
      ev.preventDefault();
      const M = S.menage;
      const t = M ? M.taches.find((x) => x.sale > 0) : undefined;
      if (M && t) { const r = rectZoneMenage(t.zone); frotter(r.x + t.nx * r.w, r.y + t.ny * r.h, 400); }
    }
  }
});

// =====================================================================
// 20. BOUCLE PRINCIPALE
// =====================================================================
function enPause() { return S.menu || (S.tuto !== null && S.tuto.pause) || document.hidden; }
function redimensionner() {
  const r = scene.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(200, r.width);
  H = Math.max(200, r.height);
  toile.width = Math.round(W * DPR);
  toile.height = Math.round(H * DPR);
}
window.addEventListener('resize', redimensionner);
window.addEventListener('orientationchange', () => setTimeout(redimensionner, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden && (S.phase === 'preparation' || S.phase === 'bilan')) sauver(); });

/** @param {number} dt */
function maj(dt) {
  if (S.phase === 'matin') {
    if (S.mj) {
      const mj = S.mj;
      mj.temps += dt;
      if (mj.fini) { mj.finT += dt; if (mj.finT > 1.0) appliquerMiniJeu(); }
      else if (mj.temps >= mj.limite) {
        if (mj.type === 'petrir' && mj.tours.length >= 2) evaluerPetrissage(mj);
        else finirMiniJeu(mj, 1, 'Temps écoulé');
      }
    }
    S.horloge += dt;
    majFournees(dt);
    majOuvriers(dt);
    if (S.horloge >= S.dureeMatin) { toast('11 h : la boutique ouvre !'); ouvrirBoutique(); }
  } else if (S.phase === 'midi') majComptoir(dt);
  else if (S.phase === 'caisse' && S.caisse && S.caisse.resultat !== null) {
    S.caisse.t += dt;
    if (S.caisse.t > 2.2) demarrerMenage();
  } else if (S.phase === 'menage' && S.menage && !S.menage.fini) {
    S.menage.temps += dt;
    if (S.menage.temps >= S.menage.duree) terminerMenage();
  }
}
function dessiner() {
  ciblesPrecedentes = cibles;
  zones = [];
  cibles = new Map();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  switch (S.phase) {
    case 'matin': dessinerFournil(); break;
    case 'midi': dessinerComptoir(); break;
    case 'caisse': dessinerCaisse(); break;
    case 'menage': dessinerMenage(); break;
    case 'preparation': case 'bilan': fondFournil(); break;
    default: dessinerDevanture();
  }
  dessinerParticules();
  dessinerFlecheTuto();
}
function dessinerFlecheTuto() {
  if (!S.tuto || !S.tuto.cible || S.mj) return;
  const r = cibles.get(S.tuto.cible);
  if (!r) return;
  const t = performance.now() / 1000;
  ctx.strokeStyle = 'rgba(79,138,69,' + (0.6 + 0.4 * Math.sin(t * 5)) + ')';
  ctx.lineWidth = 4;
  rr(ctx, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 12);
  ctx.stroke();
  const bx = r.x + r.w / 2;
  const by = r.y - 10 - 6 * Math.abs(Math.sin(t * 4));
  const haut = r.y > 40;
  ctx.fillStyle = '#4f8a45';
  ctx.beginPath();
  if (haut) { ctx.moveTo(bx, by); ctx.lineTo(bx - 12, by - 16); ctx.lineTo(bx + 12, by - 16); }
  else { const y2 = r.y + r.h + 10; ctx.moveTo(bx, y2); ctx.lineTo(bx - 12, y2 + 16); ctx.lineTo(bx + 12, y2 + 16); }
  ctx.closePath();
  ctx.fill();
}
let dernierT = performance.now();
let tempsUI = 0;
/** @param {number} t */
function boucle(t) {
  const dt = Math.min(0.05, Math.max(0, (t - dernierT) / 1000));
  dernierT = t;
  const pausee = enPause();
  if (!pausee) maj(dt);
  majParticules(dt);
  majToast(dt);
  dessiner();
  majTuto();
  positionnerBulle();
  tempsUI += dt;
  if (tempsUI > 0.25) { tempsUI = 0; majHUD(); }
  requestAnimationFrame(boucle);
}

// Interface de test (lecture seule de l'état, utile pour le débogage).
/** @type {Window & {laMieDoree?: {etat: () => EtatDeJeu, session: () => Session}}} */
const fenetre = window;
fenetre.laMieDoree = { etat: () => E, session: () => S };

redimensionner();
if (sauvegardeInitiale) E.muet = sauvegardeInitiale.muet;
rafraichirUI();
requestAnimationFrame(boucle);
})();
