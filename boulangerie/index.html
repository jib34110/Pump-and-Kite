<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f1d10">
<title>La Mie Dorée</title>
<style>
/* Direction : fournil à la lueur des lampes. Bois sombre, ardoise, croûte dorée. Thème unique volontaire. */
:root {
  --creme: #fbf3e3;
  --creme2: #f1e0bf;
  --papier: #fbf4e4;
  --brun: #5a3820;
  --brunF: #2a170c;
  --espresso: #1c0f07;
  --dore: #f2b544;
  --doreF: #a8691a;
  --miel: #ffd98c;
  --rouge: #b94a35;
  --vert: #4f8a45;
  --texte: #3a2414;
  --police: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --titre: Georgia, "Iowan Old Style", "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--espresso); color: var(--texte); font-family: var(--police);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#jeu {
  position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--espresso);
}
/* ---- Barre du haut ---- */
#hud {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; color: var(--creme);
  background: linear-gradient(180deg, #4a2b16 0%, #2e1a0c 100%);
  border-bottom: 2px solid #7a4c28; box-shadow: 0 3px 12px rgba(0,0,0,.45);
  font-size: 14px; white-space: nowrap; min-height: 50px; z-index: 3; overflow: hidden; min-width: 0;
}
#hud > * { flex-shrink: 0; }
#hud > .bloc { flex-shrink: 1; min-width: 72px; }
#hud .bloc { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
#hJour { font-family: var(--titre); font-size: 15px; color: var(--miel); overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
#hud .petit { font-size: 11px; opacity: .75; }
#hud .espace { flex: 1; }
#hHorloge, #hArgent, #hRep {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,217,140,.18); border-radius: 999px; padding: 4px 9px;
  font-variant-numeric: tabular-nums; font-weight: 700;
}
#hHorloge:empty { display: none; }
#hHorloge { color: var(--miel); }
#hRep { color: #ffd35c; }
#hArgent.gain { animation: gain .6s ease-out; }
#hArgent.perte { animation: perte .6s ease-out; }
@keyframes gain { 0% { background: rgba(120,220,110,.55); transform: scale(1.12); } 100% { background: rgba(255,255,255,.08); transform: none; } }
@keyframes perte { 0% { background: rgba(230,90,70,.55); transform: scale(1.08); } 100% { background: rgba(255,255,255,.08); transform: none; } }
#hNiv { display: flex; flex-direction: column; gap: 3px; min-width: 64px; font-weight: 700; font-size: 12px; color: var(--miel); }
.barre { height: 7px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.barre i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f2b544, #ffe08a); box-shadow: 0 0 8px rgba(255,210,110,.8); transition: width .4s; }
#hud button {
  font: inherit; font-size: 17px; width: 38px; height: 36px; border-radius: 12px; border: 1px solid rgba(255,217,140,.25);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); color: var(--creme); cursor: pointer;
}
#hud button:active { transform: translateY(1px) scale(.96); }
#hud button:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--dore); outline-offset: 2px; }
main { position: relative; overflow: hidden; background: #2a170c; }
#toile { display: block; width: 100%; height: 100%; touch-action: none; }
/* ---- Barre du bas ---- */
#barre {
  display: flex; gap: 10px; justify-content: center; align-items: center; padding: 8px 10px; min-height: 68px; flex-wrap: wrap;
  background: linear-gradient(180deg, #3a2212, #1c0f07); border-top: 2px solid #7a4c28; box-shadow: 0 -3px 12px rgba(0,0,0,.45);
}
.btn {
  position: relative; overflow: hidden; font: inherit; font-weight: 800; font-size: 17px; min-height: 50px; padding: 0 20px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.35); color: var(--brunF); cursor: pointer; flex: 0 1 auto; max-width: 100%;
  background: linear-gradient(180deg, #ffd27a 0%, #f2b544 55%, #e09a2a 100%);
  box-shadow: 0 5px 0 var(--doreF), 0 8px 16px rgba(0,0,0,.35); text-shadow: 0 1px 0 rgba(255,255,255,.4);
  transition: transform .08s, box-shadow .08s;
}
.btn::after {
  content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg);
  animation: brille 3.2s ease-in-out infinite;
}
@keyframes brille { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--doreF), 0 3px 8px rgba(0,0,0,.3); }
.btn.sec { background: linear-gradient(180deg, #fff8ea, #ecd9b6); box-shadow: 0 5px 0 #a98a5c, 0 8px 16px rgba(0,0,0,.3); }
.btn.sec::after, .btn.petit::after, .btn:disabled::after { display: none; }
.btn.danger { background: linear-gradient(180deg, #f4c4b6, #e09a86); box-shadow: 0 5px 0 #8f4535, 0 8px 16px rgba(0,0,0,.3); }
.btn.petit { min-height: 38px; font-size: 14px; padding: 0 13px; border-radius: 11px; box-shadow: 0 3px 0 var(--doreF), 0 4px 8px rgba(0,0,0,.2); }
.btn.petit.sec { box-shadow: 0 3px 0 #a98a5c, 0 4px 8px rgba(0,0,0,.18); }
.btn.petit:active { transform: translateY(2px); }
.btn:disabled { opacity: .45; cursor: default; }
/* ---- Panneaux ---- */
#panneau {
  position: absolute; inset: 0; overflow-y: auto; padding: 14px 12px; z-index: 4;
  background: radial-gradient(ellipse at top, rgba(60,32,14,.55), rgba(20,10,4,.82));
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  -webkit-overflow-scrolling: touch; -webkit-user-select: text; user-select: text;
  animation: fondu .25s ease-out;
}
@keyframes fondu { from { opacity: 0; } to { opacity: 1; } }
.carte {
  position: relative; max-width: 760px; margin: 0 auto 14px; padding: 18px 16px; border-radius: 20px;
  background:
    repeating-linear-gradient(0deg, rgba(160,110,60,.035) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, #fffaf0, var(--papier));
  border: 1px solid #e6cf9f; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 #fff;
  animation: monte .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes monte { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.carte h1 { font-family: var(--titre); font-size: 34px; margin: 0 0 6px; color: var(--brun); text-wrap: balance; }
.carte h2 { font-family: var(--titre); font-size: 22px; margin: 0 0 12px; color: var(--brun); text-wrap: balance; padding-bottom: 8px; border-bottom: 2px dotted #e0c48e; }
.carte h3 { font-size: 13px; margin: 18px 0 8px; color: var(--doreF); text-transform: uppercase; letter-spacing: .08em; }
.carte p { margin: 6px 0; line-height: 1.45; }
.discret { color: #7b6048; font-size: 13px; }
.onglets { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; margin-bottom: 10px; }
.onglet {
  font: inherit; font-weight: 700; font-size: 14px; border: 1px solid #e3c999; border-radius: 999px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  background: #fff6e2; color: var(--brun); box-shadow: 0 2px 0 #d9bd88;
}
.onglet.actif { background: linear-gradient(180deg, #6b4423, #4a2b16); color: var(--miel); border-color: #4a2b16; box-shadow: 0 2px 0 #2a170c; }
.liste { display: flex; flex-direction: column; gap: 8px; }
.ligne {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px;
  background: #fffdf7; border: 1px solid #eedcb6; box-shadow: 0 2px 0 #ecd8ae;
  transition: transform .12s;
}
.ligne:active { transform: scale(.99); }
.ligne > div { min-width: 0; }
.ligne img { width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(60,30,10,.25)); }
.ligne b { display: block; }
.ligne .act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ligne.verrou { opacity: .5; filter: grayscale(.4); }
.chiffres { font-variant-numeric: tabular-nums; }
table.bilan { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.bilan td { padding: 6px 4px; border-bottom: 1px dashed #e6cf9f; }
table.bilan td:last-child { text-align: right; white-space: nowrap; font-weight: 700; }
table.bilan tr.total td { font-family: var(--titre); font-size: 19px; border-top: 2px solid var(--brun); border-bottom: 0; padding-top: 10px; }
.pos { color: var(--vert); } .neg { color: var(--rouge); }
.alerte { background: linear-gradient(180deg, #fff1cf, #fde2a8); border: 1px solid #e8b84e; border-radius: 14px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 2px 0 #e2bf72; }
.grille2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: #fffdf7; border: 1px solid #eedcb6; border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 0 #ecd8ae; font-size: 13px; color: #7b6048; }
.stat b { display: block; font-size: 19px; color: var(--texte); font-variant-numeric: tabular-nums; margin-top: 2px; }
.dosage { font-size: 13px; color: #6b5038; }
.mini { height: 7px; border-radius: 4px; background: #efdcb6; overflow: hidden; margin-top: 5px; }
.mini i { display: block; height: 100%; background: linear-gradient(90deg, #f2b544, #ffd98c); }
.titre-accueil { text-align: center; }
.titre-accueil h1 { font-size: 42px; letter-spacing: .5px; text-shadow: 0 2px 0 #f3dcae; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
label.case { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
/* ---- Jean-Baptiste ---- */
#bulle {
  position: absolute; left: 10px; right: 10px; bottom: 10px; max-width: 560px; margin: 0 auto; z-index: 5;
  display: flex; gap: 12px; padding: 12px 14px; border-radius: 20px;
  background: linear-gradient(180deg, #fffdf6, #fbf0d8); border: 2px solid var(--dore);
  box-shadow: 0 10px 28px rgba(0,0,0,.45); animation: bulle .35s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes bulle { from { transform: translateY(16px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
#bulle .avatar {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 35% 30%, #ffe9b8, #e3a33b); border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.25);
}
#bulle .corps { flex: 1; min-width: 0; }
#bulle .nom { font-weight: 800; color: var(--doreF); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
#bulle p { margin: 3px 0 8px; font-size: 14px; line-height: 1.35; }
#bulle .act { display: flex; gap: 8px; flex-wrap: wrap; }
/* ---- Notifications ---- */
#toast {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; pointer-events: none;
  background: linear-gradient(180deg, rgba(74,43,22,.96), rgba(42,23,12,.96)); color: var(--creme);
  border: 1px solid rgba(255,217,140,.35); padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); max-width: calc(100% - 24px); text-align: center; animation: toast .3s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes toast { from { transform: translate(-50%, -10px) scale(.95); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
[hidden] { display: none !important; }
/* ---- Cadeaux ---- */
.cadeau { background: linear-gradient(180deg, #fff9ec, #fff1d4); border: 2px dashed var(--dore); border-radius: 18px; padding: 16px; margin: 10px 0; text-align: center; }
.cadeau.use { opacity: .6; }
.cadeau .paquet { font-size: 68px; line-height: 1; animation: saut 1s ease-in-out infinite alternate; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
.cadeau .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 26px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(180deg, #4a2b16, #2e1a0c); color: var(--miel); border-radius: 12px; padding: 10px 16px; margin: 8px auto; display: inline-block;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.5); -webkit-user-select: all; user-select: all; }
@keyframes saut { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-8px) rotate(4deg); } }
/* ---- Fin de journée : étoiles, coffre, gains ---- */
.recompense h2 { border: 0; margin-bottom: 4px; }
.etoiles-jour { display: flex; justify-content: center; gap: 10px; margin: 6px 0 4px; }
.etoiles-jour .et { font-size: 64px; line-height: 1; color: #d9c9a8; filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); opacity: 0; animation: etoile .55s cubic-bezier(.2,1.6,.4,1) forwards; }
.etoiles-jour .et:nth-child(2) { font-size: 80px; transform-origin: center; margin-top: -10px; }
.recompense.fixe, .recompense.fixe .et { animation: none; opacity: 1; }
.etoiles-jour .et.on { color: #ffc93c; text-shadow: 0 0 18px rgba(255,201,60,.8); }
@keyframes etoile { 0% { opacity: 0; transform: scale(2.4) rotate(-30deg); } 100% { opacity: 1; transform: none; } }
.recompense .msg { font-family: var(--titre); font-size: 19px; color: var(--brun); margin: 4px 0 10px; }
ul.objectifs { list-style: none; padding: 0; margin: 8px auto; display: flex; flex-direction: column; gap: 6px; max-width: 420px; text-align: left; }
ul.objectifs li { background: #fffdf7; border: 1px solid #eedcb6; border-radius: 12px; padding: 8px 12px; font-weight: 700; color: var(--texte); }
ul.objectifs li.ok { background: #eef8e8; border-color: #b9dcaa; }
ul.objectifs li.ko { opacity: .7; }
.coffre { position: relative; width: 130px; height: 104px; margin: 16px auto 4px; display: block; border: 0; background: none; cursor: pointer; animation: secoue 1.2s ease-in-out infinite; }
.coffre .caisse-c { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; border-radius: 10px; background: linear-gradient(180deg, #a8692e, #6e3f17); border: 4px solid #e3a33b; box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.coffre .couvercle { position: absolute; left: -4px; right: -4px; top: 8px; height: 40px; border-radius: 40px 40px 8px 8px; background: linear-gradient(180deg, #c07c3a, #7c4719); border: 4px solid #e3a33b; z-index: 2; }
.coffre .serrure { position: absolute; left: 50%; top: 40px; width: 22px; height: 26px; margin-left: -11px; border-radius: 6px; background: linear-gradient(180deg, #ffe08a, #e3a33b); z-index: 3; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
@keyframes secoue { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-6deg); } 85% { transform: rotate(6deg); } 92% { transform: rotate(-3deg); } }
.gains { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 6px; }
.gain-carte { background: linear-gradient(180deg, #fffaf0, #fbecc9); border: 2px solid #f2c96b; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  box-shadow: 0 6px 14px rgba(0,0,0,.2); opacity: 0; animation: retourne .5s cubic-bezier(.2,1.4,.4,1) forwards; }
.gain-carte span { font-size: 34px; line-height: 1; }
.gain-carte b { font-size: 15px; color: var(--brun); }
.gain-carte small { font-size: 11px; color: #7b6048; line-height: 1.2; }
.gain-carte.rare { background: linear-gradient(180deg, #fff3d0, #ffd98c); border-color: #e3a33b; box-shadow: 0 0 22px rgba(255,201,60,.6), 0 6px 14px rgba(0,0,0,.2); }
.gain-carte.vide { filter: grayscale(.8); opacity: .6; }
@keyframes retourne { 0% { opacity: 0; transform: rotateY(90deg) scale(.8); } 100% { opacity: 1; transform: none; } }
/* ---- Carte des journées ---- */
.carte-jours { display: flex; gap: 0; overflow-x: auto; padding: 10px 4px 14px; margin: 0 0 6px; align-items: center; }
.carte-jours .jour { flex: 0 0 auto; position: relative; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.carte-jours .jour::before { content: ""; position: absolute; top: 22px; left: -50%; width: 100%; height: 4px; background: #e6cf9f; z-index: 0; }
.carte-jours .jour:first-child::before { display: none; }
.carte-jours .num { position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px;
  background: #efe1c2; color: #a08868; border: 3px solid #e6cf9f; }
.carte-jours .passe .num { background: linear-gradient(180deg, #ffe08a, #f2b544); color: var(--brunF); border-color: #c98a2a; }
.carte-jours .actuel .num { background: linear-gradient(180deg, #6b4423, #4a2b16); color: var(--miel); border-color: #f2b544; box-shadow: 0 0 0 4px rgba(242,181,68,.35); animation: pulse 1.4s ease-in-out infinite; }
.carte-jours .ets { font-size: 12px; color: #f2a81d; letter-spacing: -1px; white-space: nowrap; font-weight: 800; }
.carte-jours .ets i { color: #dccbaa; font-style: normal; }
.carte-jours .actuel .ets { color: var(--doreF); letter-spacing: 0; font-size: 11px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(242,181,68,.35); } 50% { box-shadow: 0 0 0 9px rgba(242,181,68,.1); } }
@media (max-width: 420px) {
  #hud { gap: 4px; padding: 5px 5px; font-size: 12px; }
  #hDate { display: none; }
  #hJour { font-size: 13px; }
  #hud button { width: 31px; height: 32px; font-size: 15px; border-radius: 10px; }
  #hHorloge, #hArgent, #hRep { padding: 3px 6px; border: 0; }
  #hNiv { min-width: 42px; font-size: 11px; }
  #hud > .bloc { min-width: 54px; }
  .btn { font-size: 16px; padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) {
  #bulle, .carte, #panneau, #toast, .btn::after, .cadeau .paquet, #hArgent.gain, #hArgent.perte, .coffre, .carte-jours .actuel .num { animation: none; }
  .etoiles-jour .et, .gain-carte { animation: none; opacity: 1; }
  .barre i { transition: none; }
}
</style>
</head>
<body>
<div id="jeu">
  <header id="hud">
    <div class="bloc"><b id="hJour">Jour 1</b><span class="petit" id="hDate"></span></div>
    <div id="hHorloge"></div>
    <div class="espace"></div>
    <div id="hArgent">0,00 €</div>
    <div id="hNiv"><span id="hNivT">Niv. 1</span><div class="barre"><i id="hXp"></i></div></div>
    <div id="hRep" title="Réputation">★ 2,5</div>
    <button id="bMuet" type="button" aria-label="Couper le son">🔊</button>
    <button id="bMenu" type="button" aria-label="Menu">☰</button>
  </header>
  <main id="scene">
    <canvas id="toile"></canvas>
    <section id="panneau" hidden></section>
    <div id="bulle" hidden>
      <div class="avatar" aria-hidden="true">👨‍🍳</div>
      <div class="corps">
        <div class="nom">Jean-Baptiste · boulangerie Chez les voisins, Frontignan</div>
        <p id="bulleTexte"></p>
        <div class="act">
          <button class="btn petit" id="bulleOk" type="button">Compris</button>
          <button class="btn petit sec" id="bullePasser" type="button">Passer le tutoriel</button>
        </div>
      </div>
    </div>
    <div id="toast" hidden></div>
  </main>
  <footer id="barre"></footer>
</div>
<script>
// @ts-check
'use strict';
(function () {

// =====================================================================
// 1. TYPES
// =====================================================================
/** @typedef {'farine'|'farineComplete'|'eau'|'sel'|'levure'|'lait'|'sucre'|'beurre'|'chocolat'|'oeufs'|'creme'|'pommes'} IngredientId */
/** @typedef {'baguette'|'tradition'|'croissant'|'painChoc'|'complet'|'buche'|'eclair'|'tarte'} ProduitId */
/** @typedef {'petrir'|'faconner'|'pousse'|'scarifier'|'cuire'} EtapeId */
/** @typedef {'boudin'|'triangle'|'carre'|'spirale'|'ligne'|'cercle'} FormeId */
/** @typedef {'fournier'|'vendeur'|'plongeur'} RoleId */
/** @typedef {'pate'|'four'|'vente'|'menage'} TacheId */

/** @param {number} v @param {number} a @param {number} b @returns {number} */

/** @template T @param {ReadonlyArray<T>} t @returns {T} */

/** @template T @param {ReadonlyArray<T>} t @param {(v: T) => number} poidsDe @returns {T} */
function choisirPondere(t, poidsDe) {
  let total = 0;
  for (const v of t) total += poidsDe(v);
  let r = Math.random() * total;
  for (const v of t) { r -= poidsDe(v); if (r <= 0) return v; }
  return t[t.length - 1];
}
/** @param {ReadonlyArray<number>} t @returns {number} */
function moyenne(t) { if (t.length === 0) return 0; let s = 0; for (const v of t) s += v; return s / t.length; }
/** @param {number} c Centimes @returns {string} */

  const signe = c < 0 ? '−' : '';
  const a = Math.round(Math.abs(c));

}

/** @param {Point} a @param {Point} b @returns {number} */
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
/** @param {Point} p @param {ReadonlyArray<Point>} t @returns {number} */
function distMin(p, t) { let m = Infinity; for (const q of t) { const v = dist(p, q); if (v < m) m = v; } return m; }
/** @param {ReadonlyArray<Point>} t @returns {number} */
function longueur(t) { let l = 0; for (let i = 1; i < t.length; i++) l += dist(t[i - 1], t[i]); return l; }
/** @param {ReadonlyArray<Point>} t @param {number} n @returns {Point[]} */
function reechantillonner(t, n) {
  const total = longueur(t);
  if (total === 0 || t.length < 2) return t.slice();
  /** @type {Point[]} */
  const res = [{ x: t[0].x, y: t[0].y }];
  const pas = total / (n - 1);
  let acc = 0;
  let i = 1;
  let prec = t[0];
  while (i < t.length && res.length < n) {
    const seg = dist(prec, t[i]);
    if (acc + seg >= pas) {
      const k = (pas - acc) / seg;
      const p = { x: prec.x + (t[i].x - prec.x) * k, y: prec.y + (t[i].y - prec.y) * k };
      res.push(p);
      prec = p;
      acc = 0;
    } else {
      acc += seg;
      prec = t[i];
      i++;
    }
  }
  const der = t[t.length - 1];
  if (res.length < n) res.push({ x: der.x, y: der.y });
  return res;
}
/** @param {ReadonlyArray<Point>} sommets @returns {Point[]} */
function polygone(sommets) {
  /** @type {Point[]} */
  const pts = [];
  for (let i = 1; i < sommets.length; i++) {
    const a = sommets[i - 1], b = sommets[i];
    for (let k = 0; k < 20; k++) pts.push({ x: a.x + (b.x - a.x) * k / 20, y: a.y + (b.y - a.y) * k / 20 });
  }
  pts.push(sommets[sommets.length - 1]);
  return pts;
}

}

/** Complète une sauvegarde ancienne avec les clés manquantes. @param {EtatDeJeu} e @returns {EtatDeJeu} */
function reparer(e) {
  const base = nouvelEtat(false);
  for (const i of LISTE_INGREDIENTS) if (typeof e.stock[i] !== 'number') e.stock[i] = base.stock[i];
  for (const p of LISTE_PRODUITS) if (!e.competences[p]) e.competences[p] = { niv: 1, xp: 0 };
  for (const a of AMELIORATIONS) if (typeof e.ameliorations[a.id] !== 'boolean') e.ameliorations[a.id] = false;
  if (typeof e.proprete !== 'number') e.proprete = 1;
  if (typeof e.muet !== 'boolean') e.muet = false;
  if (typeof e.aideMonnaie !== 'boolean') e.aideMonnaie = true;
  if (typeof e.prologue !== 'boolean') e.prologue = false;
  if (typeof e.nomBoulangerie !== 'string') e.nomBoulangerie = '';
  if (!Array.isArray(e.etoilesJours)) e.etoilesJours = [];
  if (e.bonus === undefined) e.bonus = null;
  if (e.bonusDemain === undefined) e.bonusDemain = null;
  if (typeof e.prochainId !== 'number') e.prochainId = 1;
  for (const emp of e.employes.concat(e.candidats)) {
    if (!emp.taches) emp.taches = tachesInitiales(emp.role, emp.competence);
    if (emp.affectation === undefined) emp.affectation = emp.role === 'fournier' ? null : tachePrincipale(emp.role);
  }
  return e;
}

/** @param {ProduitId} p @param {number} n */
function gagnerCompetence(p, n) {
  const c = E.competences[p];
  if (c.niv >= CONFIG.competenceMax) return;
  c.xp += n;
  while (c.niv < CONFIG.competenceMax && c.xp >= CONFIG.xpCompetenceParNiveau * c.niv) {
    c.xp -= CONFIG.xpCompetenceParNiveau * c.niv;

}

function nombreClients() {
  if (E.prologue) return 85;
  let n = (CONFIG.clientsBase + CONFIG.clientsParEtoile * E.reputation) * (E.ameliorations.vitrine ? 1.25 : 1);
  if (E.evenement === 'fete') n *= 1.4;
  if (E.bonus === 'pub') n *= 1.25;
  if (E.evenement === 'marcheNoel') n *= 1.6;
  if (E.jour === 1) n = Math.min(n, 13);
  if (E.jour === 2) n = Math.min(n, 15);
  return Math.round(n);
}
/** @param {number} id @param {number} arrivee @returns {Client} */
function creerClient(id, arrivee) {
  const dispo = produitsDebloques();
  /** @type {LigneCommande[]} */
  const commande = [];
  const lignes = dispo.length > 1 && Math.random() < 0.4 ? 2 : 1;
  for (let i = 0; i < lignes; i++) {
    const restants = dispo.filter((p) => !commande.some((l) => l.produit === p));
    if (restants.length === 0) break;
    const p = choisirPondere(restants, (q) => RECETTES[q].popularite * (E.evenement === 'marcheNoel' && q === 'buche' ? 3 : 1));
    commande.push({ produit: p, qte: Math.max(1, Math.ceil(Math.pow(Math.random(), 1.6) * RECETTES[p].qteMax)) });
  }
  const pat = CONFIG.patienceBase * (E.tutoriel ? 1.4 : 1) * (E.bonus === 'patience' ? 1.4 : 1) * entre(0.85, 1.2);
  return { id, commande, patience: pat, patienceMax: pat, arrivee, x: -0.15, teinte: choisir(TEINTES), habit: choisir(HABITS),
    humeur: 0.7, erreurs: 0, special: false, sortie: -1 };
}
function preparerJournee() {
  const n = nombreClients();
  /** @type {Client[]} */
  const plan = [];
  const fenetre = CONFIG.dureeMidi * 0.82;
  for (let i = 0; i < n; i++) plan.push(creerClient(i + 1, 2 + (fenetre * i) / Math.max(1, n) + entre(0, fenetre / n * 0.6)));
  if (E.evenement === 'grosClient') {
    const gros = creerClient(999, CONFIG.dureeMidi * 0.4);
    const dispo = produitsDebloques();
    gros.commande = [{ produit: 'baguette', qte: 10 }];
    const autre = dispo.find((p) => p !== 'baguette');
    if (autre) gros.commande.push({ produit: autre, qte: 6 });
    gros.special = true;
    gros.patience = gros.patienceMax = 90;
    gros.habit = '#2b2b2b';
    plan.push(gros);
  }
  plan.sort((a, b) => a.arrivee - b.arrivee);
  S.planClients = plan;
  S.demande = parProduit(() => 0);
  for (const c of plan) for (const l of c.commande) S.demande[l.produit] += l.qte;
}
/** @returns {EvenementId|null} */
function tirerEvenement() {
  if (E.jour < CONFIG.jourEvenements || Math.random() > CONFIG.probaEvenement) return null;
  /** @type {EvenementId[]} */
  const possibles = ['panneFour', 'inspection', 'grosClient', 'fete'];
  if (estDecembre(E.jour)) possibles.push('marcheNoel', 'marcheNoel');
  return choisir(possibles);
}
/** @param {RoleId} role @returns {TacheId} */
function tachePrincipale(role) { return role === 'vendeur' ? 'vente' : role === 'plongeur' ? 'menage' : 'pate'; }
/** @param {RoleId} role @param {number} comp @returns {Record<TacheId, Competence>} */
function tachesInitiales(role, comp) {
  const n = (/** @type {TacheId} */ t) => ({ niv: role === 'fournier' ? (t === 'pate' || t === 'four' ? comp : 1) : t === tachePrincipale(role) ? comp : 1, xp: 0 });
  return { pate: n('pate'), four: n('four'), vente: n('vente'), menage: n('menage') };
}
/** Tâches possibles selon le poste. @param {RoleId} role @returns {TacheId[]} */
function tachesDuRole(role) { return role === 'fournier' ? ['pate', 'four'] : [tachePrincipale(role)]; }
/** @param {Employe} e */
function majCompetenceGlobale(e) {
  const t = tachesDuRole(e.role);
  e.competence = Math.round(t.reduce((s, x) => s + e.taches[x].niv, 0) / t.length);
}
/** @param {Employe} e @returns {StatOuvrier} */
function statOuvrier(e) {
  const tache = e.affectation || tachePrincipale(e.role);
  let st = S.journal.ouvriers.find((x) => x.id === e.id);
  if (!st) { st = { id: e.id, nom: e.nom, tache, actions: 0, notes: [], ventesAdd: 0, caAdd: 0, manquees: 0 }; S.journal.ouvriers.push(st); }
  return st;
}
/** @param {Employe} e @param {TacheId} t @param {number} n */
function gagnerTache(e, t, n) {
  const c = e.taches[t];
  if (c.niv >= CONFIG.competenceMax) return;
  c.xp += n;
  while (c.niv < CONFIG.competenceMax && c.niv < e.potentiel && c.xp >= 8 * c.niv) {
    c.xp -= 8 * c.niv;
    c.niv++;
    S.journal.notes.push(e.nom + ' progresse en ' + NOM_TACHE[t].toLowerCase() + ' : niveau ' + c.niv + '.');
    toast(e.nom + ' : ' + NOM_TACHE[t] + ' niveau ' + c.niv + ' !');
  }
  majCompetenceGlobale(e);
}
/** Étoiles moyennes attendues pour un niveau de tâche. @param {number} niv */
function etoilesAttendues(niv) { return borner(1 + (niv - 1) / 4.5, 1, 3); }
/** @param {number} niv */
function noteOuvrier(niv) { return borner(Math.round(etoilesAttendues(niv) + entre(-0.5, 0.5)), 1, 3); }
/** @param {TacheId} t @returns {Employe[]} */
function ouvriersSur(t) { return E.employes.filter((e) => !e.enFormation && e.affectation === t && tachesDuRole(e.role).includes(t)); }
/** @param {number} id @param {string} v */
function affecter(id, v) {
  const e = E.employes.find((x) => x.id === id);
  const t = ['pate', 'four', 'vente', 'menage'].find((x) => x === v);
  if (!e || !t) return;
  const tache = /** @type {TacheId} */ (t);
  if (!tachesDuRole(e.role).includes(tache)) return;
  e.affectation = e.affectation === tache && e.role === 'fournier' ? null : tache;
  toast(e.affectation ? e.nom + ' : ' + NOM_TACHE[e.affectation].toLowerCase() + ' aujourd’hui.' : e.nom + ' attend tes consignes.');
}
function genererCandidats() {
  E.candidats = [];
  if (E.niveau < CONFIG.niveauEquipe) return;
  /** @type {RoleId[]} */
  const roles = ['fournier', 'vendeur', 'plongeur'];
  for (let i = 0; i < 3; i++) {
    const comp = entier(1, Math.min(6, 1 + Math.floor(E.niveau / 2)));
    E.candidats.push({ id: E.prochainId++, nom: choisir(PRENOMS), role: roles[i], competence: comp,
      potentiel: entier(Math.min(10, comp + 1), 10), salaire: salaireMarche(comp) + entier(-4, 6) * 100,
      moral: 70, enFormation: false, jours: 0, taches: tachesInitiales(roles[i], comp),
      affectation: roles[i] === 'fournier' ? null : tachePrincipale(roles[i]) });
  }
}
/** @param {IngredientId} i @param {number} grammes @param {number} majoration */
function acheter(i, grammes, majoration) {
  const prix = Math.round(grammes * INGREDIENTS[i].prixKg / 1000 * majoration);
  if (E.argent < prix) { toast('Pas assez d’argent pour cet achat.'); son('echec'); return false; }
  E.argent -= prix;
  E.stock[i] += grammes;
  son('piece');
  return true;
}
/** Besoins en grammes pour couvrir la prévision. @returns {Record<IngredientId, number>} */
function besoinsPrevision() {
  const b = parIngredient(() => 0);
  const m = tailleFournee();
  for (const p of produitsDebloques()) {
    const fournees = Math.ceil(S.demande[p] / (RECETTES[p].pieces * m));
    for (const x of RECETTES[p].dosages) b[x.ingredient] += x.grammes * m * fournees;
  }
  return b;
}
/** @param {number} majoration */
function toutCompleter(majoration) {
  const b = besoinsPrevision();
  let total = 0;
  for (const i of LISTE_INGREDIENTS) {
    const ing = INGREDIENTS[i];
    if (ing.illimite) continue;
    const manque = b[i] - E.stock[i];
    if (manque <= 0) continue;
    const lots = Math.ceil(manque / ing.lot);
    if (acheter(i, lots * ing.lot, majoration)) total += lots;
  }
  if (total === 0) toast('La réserve couvre déjà la prévision.');
  else toast('Commande livrée : ' + total + ' lot' + (total > 1 ? 's' : '') + '.');
}

  /** @type {Objectif[]} */

  /** @type {Objectif[]} */

/** @param {Objectif} o @param {boolean} fin @returns {{fait: boolean, suivi: string}} */
function etatObjectif(o, fin) {
  const J = S.journal;
  const pct = J.satisfactions.length ? Math.round(100 * moyenne(J.satisfactions)) : 0;
  const menageFait = fin || S.phase === 'bilan';
  switch (o.id) {
    case 'ca': return { fait: J.ca + J.braderie >= o.cible, suivi: euros(J.ca + J.braderie) + ' / ' + euros(o.cible) };
    case 'etoiles3': return { fait: J.fournees3 >= o.cible, suivi: J.fournees3 + ' / ' + o.cible };
    case 'servis': return { fait: J.clientsServis >= o.cible, suivi: J.clientsServis + ' / ' + o.cible };
    case 'zeroPerdu': return { fait: fin && J.clientsPerdus === 0 && J.clientsServis > 0, suivi: J.clientsPerdus === 0 ? 'aucun pour l’instant' : J.clientsPerdus + ' perdu(s)' };
    case 'satisfaction': return { fait: fin && pct >= o.cible, suivi: J.satisfactions.length ? pct + ' %' : '—' };
    case 'caisse': return { fait: J.caisseJuste === true, suivi: J.caisseJuste === null ? 'ce soir' : J.caisseJuste ? 'juste' : 'erreur' };
    default: return { fait: menageFait && Math.round(J.proprete * 100) >= o.cible, suivi: menageFait ? Math.round(J.proprete * 100) + ' %' : 'ce soir' };
  }
}

/** @param {number} h @returns {string} */

/** L'aide affiche le montant à rendre ; elle est imposée pendant les 2 premiers jours du tutoriel. */

  const rapide = mj.premiereCoupe >= 0 && mj.temps - mj.premiereCoupe < 2 && mj.marques.every((x) => x.fait);
  if (rapide) pts += 1;
  const n = pts >= 6 ? 3 : pts >= 3 ? 2 : 1;
  finirMiniJeu(mj, n, (n === 3 ? 'Grignes parfaites !' : n === 2 ? 'Belles grignes' : 'Coupes hésitantes') + (rapide ? ' · rapide !' : ''));
}
/** @param {Fournee} f */
function defourner(f) {
  if (f.lieu !== 'four') return;
  const p = f.minuteur / f.duree;
  if (p < 0.55) { toast('Trop tôt : la pâte est encore crue.'); son('echec'); return; }
  f.notes.push(noteCuisson(p, E.competences[f.recette].niv));
  terminerFournee(f);
}
/** @param {Fournee} f */
function terminerFournee(f) {
  const n = borner(Math.round(moyenne(f.notes)), 1, 3);
  const r = RECETTES[f.recette];
  const nb = r.pieces * f.mult;
  ajouterVitrine(f.recette, nb, n);
  S.fournees = S.fournees.filter((x) => x !== f);
  S.journal.fourneesFaites++;
  if (n === 3) S.journal.fournees3++;
  gagnerXP(CONFIG.xpFournee * n);
  gagnerCompetence(f.recette, 3 * n);
  { const rf = rectsFour.get(f.id); flotter(rf ? rf.x + rf.w / 2 : W / 2, rf ? rf.y + rf.h * 0.3 : H / 2, '+' + CONFIG.xpFournee * n + ' XP ' + '★'.repeat(n), '#b8f0a8'); }
  toast(nb + ' ' + r.pluriel + ' ' + etoiles(n) + ' en vitrine · ' + euros(prixVente(f.recette, n)) + ' pièce · +' + CONFIG.xpFournee * n + ' XP');
  son('ding');
}
/** @param {Fournee} f @returns {TravailOuvrier|null} */
function travailSur(f) { return S.travaux.find((t) => t.fournee === f.id) || null; }
/** Les ouvriers de fabrication travaillent seuls. @param {number} dt */
function majOuvriers(dt) {
  // Pâte : pétrir, façonner, scarifier
  for (const e of ouvriersSur('pate')) {
    let tr = S.travaux.find((t) => t.emp === e.id) || null;
    if (tr) {
      const f = trouverFournee(tr.fournee);
      if (!f || !estGeste(etapeCourante(f))) { S.travaux = S.travaux.filter((t) => t !== tr); continue; }
      tr.t += dt;
      if (tr.t >= tr.duree) {
        const n = noteOuvrier(e.taches.pate.niv);
        f.notes.push(n);
        f.etape++;
        const st = statOuvrier(e);
        st.actions++;
        st.notes.push(n);
        gagnerTache(e, 'pate', 1 + n);
        S.travaux = S.travaux.filter((t) => t !== tr);
        son('pate');
      }
    } else {
      const libre = S.fournees.find((f) => estGeste(etapeCourante(f)) && !travailSur(f) && !(S.mj && S.mj.fournee === f.id));
      if (libre) S.travaux.push({ emp: e.id, fournee: libre.id, t: 0, duree: Math.max(2, 7.5 - 0.5 * e.taches.pate.niv) });
    }
  }
  // Four : défourner au bon moment, avec une précision qui dépend du niveau
  const fourniers = ouvriersSur('four');
  if (fourniers.length) {
    const e = fourniers.reduce((a, b) => (b.taches.four.niv > a.taches.four.niv ? b : a));
    for (const f of S.fournees.slice()) {
      if (f.lieu !== 'four') continue;
      if (f.cibleOuvrier === 0) {
        const ecart = Math.max(0.03, 0.17 - 0.014 * e.taches.four.niv);
        f.cibleOuvrier = borner(0.95 + entre(-ecart, ecart), 0.6, 1.25);
      }
      if (f.minuteur / f.duree >= f.cibleOuvrier) {
        f.notes.push(noteCuisson(f.minuteur / f.duree, E.competences[f.recette].niv));
        const st = statOuvrier(e);
        st.actions++;
        st.notes.push(f.notes[f.notes.length - 1]);
        gagnerTache(e, 'four', 1 + f.notes[f.notes.length - 1]);
        toast(e.nom + ' défourne : ' + RECETTES[f.recette].pluriel + ' ' + etoiles(f.notes[f.notes.length - 1]) + '.');
        terminerFournee(f);
      }
    }
  }
}
/** @param {number} dt */
function majFournees(dt) {
  const tutoFour = E.tutoriel && E.jour === 1;
  for (const f of S.fournees.slice()) {
    const et = etapeCourante(f);
    if (et === 'petrir' && E.ameliorations.petrin) { f.notes.push(3); f.etape++; continue; }
    if (et === 'pousse') {
      if (f.lieu !== 'pousse') {
        if (compterLieu('pousse') < placesPousse()) { f.lieu = 'pousse'; f.minuteur = 0; f.duree = dureePousse(f.recette); }
      } else {
        f.minuteur += dt;
        if (f.minuteur >= f.duree) { f.etape++; son('clic'); }
      }
    } else if (et === 'cuire') {
      if (f.lieu !== 'four') {
        if (compterLieu('four') < placesFour()) { f.lieu = 'four'; f.minuteur = 0; f.duree = dureeCuisson(f.recette); son('clic'); }
      } else {
        f.minuteur += dt;
        if (tutoFour) f.minuteur = Math.min(f.minuteur, f.duree * 1.1);
        const p = f.minuteur / f.duree;
        if (p >= 1.3) {
          S.fournees = S.fournees.filter((x) => x !== f);
          S.journal.fourneesRatees++;
          toast('Fournée de ' + RECETTES[f.recette].pluriel + ' brûlée !');
          secousse = 1;
          son('echec');
          const r = rectsFour.get(f.id);
          if (r) for (let i = 0; i < 25; i++) ajouterParticule(r.x + r.w / 2, r.y + r.h / 3, 'fumee');
        }
      }
    }
  }
}

/** @param {EtatComptoir} C @returns {Client|null} */
function clientJoueur(C) { return C.clients.find((c) => !C.vendeurs.some((v) => v.client === c)) || null; }
/** @param {Client} cl @param {number} satisfaction @param {'servi'|'perdu'|'rupture'|'ferme'} raison */
function partir(cl, satisfaction, raison) {
  const C = S.comptoir;
  if (!C) return;
  C.clients = C.clients.filter((c) => c !== cl);
  for (const v of C.vendeurs) if (v.client === cl) v.client = null;
  cl.humeur = satisfaction;
  cl.sortie = 0;
  C.sortants.push(cl);
  if (raison !== 'ferme') S.journal.satisfactions.push(satisfaction);
  if (raison === 'perdu') { S.journal.clientsPerdus++; dire('Un client est parti, lassé d’attendre.'); son('echec'); }
  if (raison === 'ferme') S.journal.clientsPerdus++;
  for (const p of LISTE_PRODUITS) C.plateau[p] = Math.min(C.plateau[p], S.vitrine[p].length);
}
/** @param {string} t */
function dire(t) { const C = S.comptoir; if (C) { C.message = t; C.messageT = 2.6; } }
/** @param {ProduitId} p */
function ajouterPlateau(p) {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  if (C.plateau[p] >= S.vitrine[p].length) { dire('Plus de ' + RECETTES[p].nom.toLowerCase() + ' en vitrine.'); son('echec'); return; }
  C.plateau[p]++;
  son('clic');
}
/** @param {ProduitId} p */
function retirerPlateau(p) {
  const C = S.comptoir;
  if (!C || C.paiement || C.plateau[p] <= 0) return;
  C.plateau[p]--;
  son('clic');
}
function servir() {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  const cl = clientJoueur(C);
  if (!cl) return;
  let partiel = false;
  let nbPlateau = 0;
  let dispoCommande = 0;
  for (const p of LISTE_PRODUITS) {
    const ligne = cl.commande.find((l) => l.produit === p);
    const cmd = ligne ? ligne.qte : 0;
    const pl = C.plateau[p];
    const dispo = S.vitrine[p].length;
    nbPlateau += pl;
    dispoCommande += Math.min(cmd, dispo);
    if (pl > cmd) { erreurService(cl, cmd === 0 ? 'Je n’ai pas demandé de ' + RECETTES[p].nom.toLowerCase() + ' !' : 'Trop de ' + RECETTES[p].pluriel + ' !'); return; }
    if (pl < Math.min(cmd, dispo)) { erreurService(cl, 'Il manque ' + (Math.min(cmd, dispo) - pl) + ' ' + (cmd - pl > 1 ? RECETTES[p].pluriel : RECETTES[p].nom.toLowerCase()) + '.'); return; }
    if (pl < cmd) partiel = true;
  }
  if (nbPlateau === 0) {
    if (dispoCommande > 0) { erreurService(cl, 'Vous ne me servez rien ?'); return; }
    rupture();
    return;
  }
  let total = 0;
  /** @type {number[]} */
  const notes = [];
  for (const p of LISTE_PRODUITS) {
    for (let i = 0; i < C.plateau[p]; i++) {
      const prod = S.vitrine[p].shift();
      if (!prod) continue;
      total += prod.prix;
      notes.push(prod.etoiles);
      S.journal.ventes[p]++;
    }
    C.plateau[p] = 0;
  }
  if (cl.special) total = Math.round(total * 1.2 / 10) * 10;
  let donne = total;
  if (Math.random() > 0.3) {
    const billets = [500, 1000, 2000, 5000];
    donne = billets.find((b) => b > total) || Math.ceil(total / 1000) * 1000 + 1000;
  }
  const pay = { client: cl, total, donne, rendu: 0, partiel, qualite: moyenne(notes) };
  son('piece');
  if (donne === total) { encaisser(pay, true); return; }
  C.paiement = pay;
}
/** @param {Client} cl @param {string} texte */
function erreurService(cl, texte) {
  cl.erreurs++;
  cl.patience -= cl.patienceMax * 0.12;
  dire(texte);
  son('echec');
}
function rupture() {
  const C = S.comptoir;
  if (!C || C.paiement) return;
  const cl = clientJoueur(C);
  if (!cl) return;
  const disponible = cl.commande.some((l) => S.vitrine[l.produit].length - C.plateau[l.produit] > 0);
  for (const p of LISTE_PRODUITS) C.plateau[p] = 0;
  dire(disponible ? 'Mais il y en a en vitrine !' : 'Tant pis, à demain.');
  partir(cl, disponible ? 0.15 : 0.45, 'rupture');
  son(disponible ? 'echec' : 'clic');
}
/** @param {number} v */
function ajouterMonnaie(v) {
  const C = S.comptoir;
  if (!C || !C.paiement) return;
  C.paiement.rendu += v;
  son('piece');
}
function effacerMonnaie() { const C = S.comptoir; if (C && C.paiement) { C.paiement.rendu = 0; son('clic'); } }
function rendreMonnaie() {
  const C = S.comptoir;
  if (!C || !C.paiement) return;
  const pay = C.paiement;
  const du = pay.donne - pay.total;
  if (pay.rendu === du) { encaisser(pay, true); return; }
  if (pay.rendu < du) {
    dire('Il manque ' + euros(du - pay.rendu) + ' sur ma monnaie.');
    pay.rendu = du;
    encaisser(pay, false);
  } else {
    dire('Vous m’avez rendu ' + euros(pay.rendu - du) + ' de trop, merci !');
    encaisser(pay, false);
  }
}
/** @param {Paiement} pay @param {boolean} monnaieOk */
function encaisser(pay, monnaieOk) {
  const C = S.comptoir;
  if (!C) return;
  const net = pay.donne - (pay.donne === pay.total ? 0 : pay.rendu);
  E.argent += net;
  S.journal.ca += net;
  const cl = pay.client;
  const sat = borner(1 - 0.35 * (1 - cl.patience / cl.patienceMax) - 0.15 * cl.erreurs - (pay.partiel ? 0.25 : 0) -
    (monnaieOk ? 0 : 0.1) + (pay.qualite - 2) * 0.12, 0, 1);
  S.journal.clientsServis++;
  gagnerXP(CONFIG.xpClient + (monnaieOk && pay.donne !== pay.total ? CONFIG.xpMonnaie : 0));
  C.paiement = null;
  if (monnaieOk && pay.donne !== pay.total && !aideMonnaieActive()) {
    const bonus = Math.round(pay.total * CONFIG.bonusSansAide / 10) * 10;
    E.argent += bonus;
    S.journal.bonusCalcul += bonus;
  }
  if (monnaieOk) dire(sat > 0.75 ? 'Merci, bonne journée !' : sat > 0.45 ? 'Merci.' : 'Enfin…');
  partir(cl, sat, 'servi');
  const R = rectsComptoir.boutique;
  for (let i = 0; i < 8; i++) ajouterParticule(R.x + R.w * 0.5, R.y + R.h * 0.45, 'piece');
  flotter(R.x + R.w * 0.45, R.y + R.h * 0.3, '+' + euros(net), '#ffd35c');
}
/** @param {number} dt Temps de jeu (accéléré) @param {number} dtReel Temps réel, pour la patience */
function majComptoir(dt, dtReel) {
  const C = S.comptoir;
  if (!C) return;
  C.temps += dt;
  if (C.messageT > 0) C.messageT -= dt;
  while (!C.fermeture && C.aVenir.length && C.aVenir[0].arrivee <= C.temps) {
    const cl = C.aVenir.shift();
    if (cl) { C.clients.push(cl); son('clochette'); }
  }
  for (const cl of C.clients.slice()) {
    if (C.paiement && C.paiement.client === cl) continue;
    if (C.vendeurs.some((v) => v.client === cl)) continue;
    cl.patience -= dtReel;
    if (cl.patience <= 0) partir(cl, 0, 'perdu');
  }
  // Vendeur
  for (const poste of C.vendeurs) {
    const v = E.employes.find((x) => x.id === poste.emp);
    if (!v) continue;
    poste.t -= dt;
    if (poste.client) {
      if (poste.t <= 0) servirParVendeur(C, poste, v);
    } else if (poste.t <= 0) {
      const joueur = clientJoueur(C);
      const candidat = C.clients.find((c) => c !== joueur && !C.vendeurs.some((p) => p.client === c));
      if (candidat) {
        if (Math.random() < 0.55 + 0.05 * v.taches.vente.niv) { poste.client = candidat; poste.t = 4.6 - 0.25 * v.taches.vente.niv; }
        else poste.t = 2;
      }
    }
  }
  for (const s of C.sortants) s.sortie += dt;
  C.sortants = C.sortants.filter((s) => s.sortie < 1.6);
  if (C.temps >= C.duree && C.aVenir.length) C.aVenir = [];
  if (C.aVenir.length === 0 && C.clients.length === 0 && !C.paiement) {
    C.finT += dt;
    if (C.finT > 1.4) terminerMidi();
  }
}
/** @param {EtatComptoir} C @param {PosteVendeur} poste @param {Employe} v */
function servirParVendeur(C, poste, v) {
  const cl = poste.client;
  if (!cl) return;
  let total = 0;
  for (const l of cl.commande) {
    const libres = S.vitrine[l.produit].length - C.plateau[l.produit];
    const n = Math.max(0, Math.min(l.qte, libres));
    for (let i = 0; i < n; i++) {
      const prod = S.vitrine[l.produit].pop();
      if (prod) { total += prod.prix; S.journal.ventes[l.produit]++; }
    }
  }
  poste.client = null;
  poste.t = 0.7;
  const st = statOuvrier(v);
  const niv = v.taches.vente.niv;
  if (total === 0) { partir(cl, 0.4, 'rupture'); gagnerTache(v, 'vente', 1); return; }
  // Vente additionnelle : plus le vendeur est expérimenté, plus il en propose.
  if (Math.random() < 0.08 + 0.05 * niv) {
    const p = choisirPondere(produitsDebloques(), (q) => RECETTES[q].popularite);
    const libres = S.vitrine[p].length - C.plateau[p];
    if (libres > 0) {
      const prod = S.vitrine[p].pop();
      if (prod) {
        total += prod.prix;
        S.journal.ventes[p]++;
        st.ventesAdd++;
        st.caAdd += prod.prix;
        gagnerTache(v, 'vente', 2);
        dire('Vente additionnelle de ' + v.nom + ' : 1 ' + RECETTES[p].nom.toLowerCase().replace(' (part)', '') + ' en plus !');
        son('piece');
      }
    } else {
      st.manquees++;
      dire(v.nom + ' aurait vendu 1 ' + RECETTES[p].nom.toLowerCase().replace(' (part)', '') + ' de plus : rupture !');
    }
  }
  st.actions++;
  gagnerTache(v, 'vente', 1);
  if (cl.special) total = Math.round(total * 1.2 / 10) * 10;
  E.argent += total;
  S.journal.ca += total;
  S.journal.clientsServis++;
  gagnerXP(Math.round(CONFIG.xpClient / 2));
  { const Rb = rectsComptoir.boutique; flotter(Rb.x + Rb.w * 0.78, Rb.y + Rb.h * 0.3, '+' + euros(total), '#ffd35c'); }
  partir(cl, borner(0.55 + 0.04 * niv, 0, 1), 'servi');
}

/** @param {number} id */
function embaucher(id) {
  const c = E.candidats.find((x) => x.id === id);
  if (!c) return;
  if (E.argent < CONFIG.capitalEmbauche) { toast('Il faut au moins ' + euros(CONFIG.capitalEmbauche) + ' en caisse pour embaucher.'); return; }
  if (E.employes.length >= 6) { toast('L’équipe est complète (6 personnes).'); return; }
  E.argent -= CONFIG.fraisEmbauche;
  E.employes.push(c);
  E.candidats = E.candidats.filter((x) => x !== c);
  toast(c.nom + ' rejoint l’équipe.');
  son('succes');
  sauver();
  rafraichirUI();
}
/** @param {Employe} e @param {TacheId} t */
function coutFormation(e, t) { return 6000 + e.taches[t].niv * 1500; }
/** @param {number} id @param {string} v */
function former(id, v) {
  const e = E.employes.find((x) => x.id === id);
  const t0 = ['pate', 'four', 'vente', 'menage'].find((x) => x === v);
  if (!e || !t0) return;
  const t = /** @type {TacheId} */ (t0);
  const c = e.taches[t];
  if (c.niv >= e.potentiel) { toast(e.nom + ' a atteint son potentiel en ' + NOM_TACHE[t].toLowerCase() + '.'); return; }
  if (e.enFormation) { toast(e.nom + ' est déjà en formation aujourd’hui.'); return; }
  const cout = coutFormation(e, t);
  if (E.argent < cout) { toast('Pas assez d’argent pour la formation.'); return; }
  E.argent -= cout;
  c.niv++;
  c.xp = 0;
  majCompetenceGlobale(e);
  e.enFormation = true;
  e.moral = borner(e.moral + 8, 0, 100);
  toast(e.nom + ' part en formation aujourd’hui (' + NOM_TACHE[t].toLowerCase() + ' niveau ' + c.niv + ').');
  sauver();
  rafraichirUI();
}
/** @param {number} id */
function augmenter(id) {
  const e = E.employes.find((x) => x.id === id);
  if (!e) return;
  e.salaire += 500;
  e.moral = borner(e.moral + 12, 0, 100);
  toast(e.nom + ' : salaire porté à ' + euros(e.salaire) + ' par jour.');
  sauver();
  rafraichirUI();
}
/** @param {number} id */
function licencier(id) {
  const e = E.employes.find((x) => x.id === id);
  if (!e) return;
  E.argent -= e.salaire * 2;
  E.employes = E.employes.filter((x) => x !== e);
  for (const autre of E.employes) autre.moral = borner(autre.moral - 8, 0, 100);
  toast(e.nom + ' quitte la boulangerie (indemnité ' + euros(e.salaire * 2) + ').');
  sauver();
  rafraichirUI();
}
/** @param {AmeliorationId} id */
function acheterAmelioration(id) {
  const a = AMELIORATIONS.find((x) => x.id === id);
  if (!a || E.ameliorations[id]) return;
  if (E.niveau < a.niveau) { toast('Disponible au niveau ' + a.niveau + '.'); return; }
  if (E.argent < a.prix) { toast('Il manque ' + euros(a.prix - E.argent) + '.'); return; }
  E.argent -= a.prix;
  E.ameliorations[id] = true;
  toast('Travaux terminés : ' + a.nom + '.');
  son('niveau');
  if (id === 'vitrine') preparerJournee();
  sauver();
  rafraichirUI();
}

/** @type {Particule[]} */
let particules = [];
const MAX_PARTICULES = 150;
/** @param {number} x @param {number} y @param {TypeParticule} type */
function ajouterParticule(x, y, type) {
  if (particules.length >= MAX_PARTICULES) particules.shift();
  const a = Math.random() * Math.PI * 2;
  const v = type === 'fumee' || type === 'vapeur' ? entre(10, 30) : entre(40, 150);
  particules.push({ x, y, vx: Math.cos(a) * v, vy: type === 'fumee' || type === 'vapeur' ? -entre(20, 50) : Math.sin(a) * v - 40,
    vie: 0, max: type === 'fumee' ? 1.8 : entre(0.5, 1.1), taille: type === 'fumee' ? entre(6, 14) : entre(2, 5), type });
}
/** @param {number} dt */
function majParticules(dt) {
  for (const p of particules) {
    p.vie += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 'farine' || p.type === 'piece' || p.type === 'etincelle') p.vy += 220 * dt;
    if (p.type === 'fumee' || p.type === 'vapeur') { p.taille += 10 * dt; p.vx *= 0.98; }
  }
  particules = particules.filter((p) => p.vie < p.max);
}
function dessinerParticules() {
  for (const p of particules) {
    const a = 1 - p.vie / p.max;
    ctx.globalAlpha = Math.max(0, a);
    if (p.type === 'farine') ctx.fillStyle = '#fffdf6';
    else if (p.type === 'fumee') ctx.fillStyle = 'rgba(70,60,55,0.55)';
    else if (p.type === 'vapeur') ctx.fillStyle = 'rgba(255,255,255,0.5)';
    else if (p.type === 'piece') ctx.fillStyle = '#f2c14e';
    else if (p.type === 'bulle') ctx.fillStyle = 'rgba(200,230,255,0.8)';
    else ctx.fillStyle = '#ffd35c';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.taille, 0, Math.PI * 2);
    ctx.fill();

}

  const cles = [[6, '#2c3e70', '#f3a96b'], [8, '#7fb6e6', '#d9eef8'], [13, '#5aa7e6', '#c7e6f8'], [17, '#7a9fd6', '#f6c48a'], [19, '#3b3a6b', '#f08a5d']];
  for (let i = 1; i < cles.length; i++) {
    if (h <= cles[i][0]) {
      const a = cles[i - 1], b = cles[i];
      const k = (h - a[0]) / (b[0] - a[0]);
      return [melange(a[1], b[1], k), melange(a[2], b[2], k)];
    }
  }
  return [cles[cles.length - 1][1], cles[cles.length - 1][2]];
}
/** @param {EtatComptoir} C @param {Client} cl @param {number} x @param {number} yBas @param {Rect} R */
function dessinerCommande(C, cl, x, yBas, R) {
  const n = cl.commande.length;
  const t = Math.min(46, R.h * 0.16);
  const w = n * (t + 34) + 16;
  const h = t + 26;
  const bx = borner(x - w / 2, R.x + 4, R.x + R.w - w - 4);
  const by = Math.max(R.y + 40, yBas - h);
  const qx = borner(x, bx + 16, bx + w - 16);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.beginPath();
  ctx.moveTo(qx - 9, by + h - 1); ctx.lineTo(qx, by + h + 11); ctx.lineTo(qx + 9, by + h - 1); ctx.closePath();
  ctx.fillStyle = '#fffaf0';
  ctx.fill();
  rr(ctx, bx, by, w, h, 14);
  ctx.fill();
  ctx.restore();
  rr(ctx, bx, by, w, h, 14);
  ctx.strokeStyle = cl.special ? '#2b2b2b' : 'rgba(201,167,117,0.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
  cl.commande.forEach((l, i) => {
    const cx = bx + 12 + i * (t + 34) + t / 2;
    dessinerProduit(ctx, l.produit, cx, by + t / 2 + 4, t, 1);
    const ok = C.plateau[l.produit] === Math.min(l.qte, S.vitrine[l.produit].length) && C.plateau[l.produit] > 0;
    ecrire('×' + l.qte, cx + t / 2 + 14, by + t / 2 + 4, 15, ok ? '#4f8a45' : '#3a2414', 'center', 800);

  });
  const pr = borner(cl.patience / cl.patienceMax, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(bx + 8, by + h - 8, w - 16, 4);
  ctx.fillStyle = pr > 0.5 ? '#4f8a45' : pr > 0.25 ? '#e3a33b' : '#b94a35';
  ctx.fillRect(bx + 8, by + h - 8, (w - 16) * pr, 4);
  if (cl.special) ecrire('Grosse commande · +20 %', bx + w / 2, by - 9, 11, '#2b2b2b', 'center', 800);
}
/** @param {EtatComptoir} C @param {Rect} R */
function dessinerVitrine(C, R) {
  panneauSection(R, 'Vitrine · touche ou glisse vers le panier', 'verre');
  const prods = produitsDebloques();

  const zx = R.x + 8, zy = R.y + 26, zw = R.w - 16, zh = R.h - 32;
  const g = 6;
  const cw = (zw - g * (cols - 1)) / cols;
  const ch = (zh - g * (lignes - 1)) / lignes;
  prods.forEach((p, i) => {
    const r = { x: zx + (i % cols) * (cw + g), y: zy + Math.floor(i / cols) * (ch + g), w: cw, h: ch };
    const stock = S.vitrine[p];
    const libres = stock.length - C.plateau[p];

    const t = Math.min(r.w * 0.6, r.h * 0.5);

}
/** @param {EtatComptoir} C @param {Rect} R */
function dessinerPlateau(C, R) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  rr(ctx, R.x, R.y, R.w, R.h, 16);
  const pg = ctx.createLinearGradient(0, R.y, 0, R.y + R.h);
  pg.addColorStop(0, '#c99257'); pg.addColorStop(1, '#8c5a2b');
  ctx.fillStyle = pg;
  ctx.fill();
  ctx.restore();
  ctx.save();
  rr(ctx, R.x, R.y, R.w, R.h, 16);
  ctx.clip();
  ctx.strokeStyle = 'rgba(70,40,15,0.35)';
  ctx.lineWidth = 2;
  for (let x = R.x; x < R.x + R.w; x += 12) { ctx.beginPath(); ctx.moveTo(x, R.y); ctx.lineTo(x + 6, R.y + R.h); ctx.stroke(); }
  ctx.restore();
  rr(ctx, R.x + 6, R.y + 6, R.w - 12, R.h - 12, 11);
  ctx.fillStyle = '#f8efdc';
  ctx.fill();
  let total = 0;
  /** @type {ProduitId[]} */
  const presentsP = [];
  for (const p of LISTE_PRODUITS) if (C.plateau[p] > 0) {
    presentsP.push(p);
    for (let i = 0; i < C.plateau[p]; i++) total += S.vitrine[p][i] ? S.vitrine[p][i].prix : 0;
  }
  if (presentsP.length === 0) ecrire('Panier vide', R.x + R.w / 2, R.y + R.h / 2, 13, '#a08868', 'center', 700);
  const t = Math.min(R.h * 0.62, 44);
  const wTotal = 96;
  presentsP.forEach((p, i) => {
    const r = { x: R.x + 8 + i * (t + 30), y: R.y + (R.h - t) / 2, w: t + 24, h: t };
    if (r.x + r.w > R.x + R.w - wTotal) return;
    dessinerProduit(ctx, p, r.x + t / 2, r.y + t / 2, t, 1);
    ecrire('×' + C.plateau[p], r.x + t + 6, r.y + t / 2, 13, '#3a2414', 'center', 800);
    zone('plateau-' + p, r, () => retirerPlateau(p));
  });
  ecrire('Total', R.x + R.w - 14, R.y + R.h / 2 - 9, 11, '#8a6a48', 'right', 700);
  ecrire(euros(total), R.x + R.w - 14, R.y + R.h / 2 + 8, 15, '#2f1d10', 'right', 800);
  cibles.set('plateau', R);
}

/** @param {number} v @param {number} x @param {number} y @param {number} s */
function dessinerArgent(v, x, y, s) {
  if (v >= 500) {
    const coul = v >= 5000 ? '#e39a52' : v >= 2000 ? '#6f9fd1' : v >= 1000 ? '#d16f6f' : '#9fb38c';
    const w = s * 1.1, h = s * 0.56;
    rr(ctx, x - w / 2, y - h / 2, w, h, 4);
    ctx.fillStyle = coul;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x - w * 0.25, y, h * 0.28, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
    ecrire(String(v / 100), x + w * 0.18, y, h * 0.5, '#1d1d1d', 'center', 800);
    return;
  }
  const r = s * (v === 200 ? 0.34 : v === 100 ? 0.31 : v === 50 ? 0.3 : v === 20 ? 0.27 : 0.24);
  const or = '#e4b84d', argent = '#c9cdd1';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = v === 200 ? argent : v === 100 ? or : '#d9a940';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (v >= 100) { ctx.beginPath(); ctx.arc(x, y, r * 0.68, 0, Math.PI * 2); ctx.fillStyle = v === 200 ? or : argent; ctx.fill(); }
  ecrire(v >= 100 ? (v / 100) + ' €' : v + ' c', x, y, r * 0.62, '#2f1d10', 'center', 800);
}

/** @param {Coupure[]} liste @param {Rect} R @param {boolean} billets */
function dessinerCasiers(liste, R, billets) {
  const valeurs = billets ? [5000, 2000, 1000, 500] : [200, 100, 50, 20, 10];
  const n = valeurs.length;
  const g = 4;
  const w = (R.w - g * (n - 1)) / n;
  valeurs.forEach((v, i) => {
    const r = { x: R.x + i * (w + g), y: R.y, w, h: R.h };
    rr(ctx, r.x, r.y, r.w, r.h, 6);
    ctx.fillStyle = '#3a2414';
    ctx.fill();
    ecrire(v >= 100 ? (v / 100) + ' €' : v + ' c', r.x + r.w / 2, r.y + 9, 10, '#c9a775', 'center', 700);
    const c = liste.find((x) => x.valeur === v);
    const nb = c ? c.n : 0;
    if (nb === 0) return;
    // Nombre de billets ou de pièces, pour compter facilement
    rr(ctx, r.x + 3, r.y + r.h - 20, r.w - 6, 17, 6);
    ctx.fillStyle = '#f1e0bf';
    ctx.fill();
    ecrire(nb + ' × ' + (v >= 100 ? (v / 100) + ' €' : v + ' c'), r.x + r.w / 2, r.y + r.h - 11.5, 11, '#2f1d10', 'center', 800, r.w - 8);
    const zy = r.y + 18, zh = r.h - 42;
    if (billets) {
      const bw = r.w * 0.86, bh = Math.min(zh * 0.45, bw * 0.55);
      const pas = nb > 1 ? Math.min(bh * 0.55, (zh - bh) / (nb - 1)) : 0;
      for (let k = 0; k < nb; k++) dessinerArgent(v, r.x + r.w / 2, zy + bh / 2 + k * pas, bw / 1.1);
    } else {
      let rad = Math.min(r.w * 0.2, zh * 0.18);
      let parLigne = Math.max(1, Math.floor((r.w - 4) / (2 * rad + 3)));
      let lignes = Math.ceil(nb / parLigne);
      if (lignes * (2 * rad + 3) > zh) {
        rad = Math.max(4, (Math.sqrt((r.w - 4) * zh / nb) - 3) / 2);
        parLigne = Math.max(1, Math.floor((r.w - 4) / (2 * rad + 3)));
        lignes = Math.ceil(nb / parLigne);
      }
      const k0 = v === 200 ? 0.34 : v === 100 ? 0.31 : v === 50 ? 0.3 : v === 20 ? 0.27 : 0.24;
      for (let k = 0; k < nb; k++) {
        const col = k % parLigne, lig = Math.floor(k / parLigne);
        dessinerArgent(v, r.x + 2 + rad + 1.5 + col * (2 * rad + 3), zy + rad + 1.5 + lig * (2 * rad + 3), rad / k0 * 0.95);
      }
    }
  });
}

// ---- Ménage ----
function dessinerMenage() {
  const M = S.menage;
  if (!M) return;
  fondFournil();
  const R = rectMenage();
  ctx.save();
  rr(ctx, R.x, R.y, R.w, R.h, 14);
  ctx.clip();
  for (let x = R.x; x < R.x + R.w; x += 40) for (let y = R.y; y < R.y + R.h; y += 40) {
    ctx.fillStyle = ((x - R.x) / 40 + (y - R.y) / 40) % 2 < 1 ? '#efe6d6' : '#d9cbb4';
    ctx.fillRect(x, y, 40, 40);
  }
  ctx.restore();
  rr(ctx, R.x, R.y, R.w, R.h, 14);
  ctx.strokeStyle = '#7a4c28';
  ctx.lineWidth = 3;
  ctx.stroke();
  const total = Math.max(1, M.nettoyees + M.ratees);
  const pr = Math.round(100 * M.nettoyees / total);
  ecrire('🧽 ' + Math.max(0, Math.ceil(M.duree - M.temps)) + ' s · propreté ' + pr + ' %' + (M.combo >= 2 ? ' · combo ×' + M.combo : ''), W / 2, 18, 16, '#ffe2a6', 'center', 800, W - 16);
  rr(ctx, R.x, 34, R.w, 7, 3.5);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
  rr(ctx, R.x, 34, R.w * Math.max(0, 1 - M.temps / M.duree), 7, 3.5);
  ctx.fillStyle = M.duree - M.temps < 4 ? '#e0634a' : '#f2b544';
  ctx.fill();
  const couleurs = ['#8a6a48', '#3b2414', '#b8323a'];
  const tps = performance.now() / 1000;
  for (const t of M.taches) {
    if (t.sale <= 0) continue;
    const cx = R.x + t.x * R.w, cy = R.y + t.y * R.h;
    const base = t.r * Math.min(R.w, R.h);
    const rad = base * (0.6 + 0.4 * Math.min(1, t.age / 0.35));
    const urgent = !t.incrustee && t.age > VIE_TACHE - 1;
    ctx.globalAlpha = t.incrustee ? 0.9 : (urgent && Math.sin(tps * 20) > 0 ? 0.55 : 0.85) * Math.max(0.25, t.sale);
    ctx.fillStyle = t.incrustee ? '#2a1a10' : couleurs[t.genre];
    ctx.beginPath();
    for (let k = 0; k <= 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const r2 = rad * (0.8 + 0.22 * Math.sin(a * 3 + t.x * 17));
      if (k === 0) ctx.moveTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); else ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
    if (!t.incrustee) {
      ctx.strokeStyle = urgent ? '#e0634a' : 'rgba(79,138,69,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, rad + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - t.age / VIE_TACHE)); ctx.stroke();
    } else ecrire('✗', cx, cy, 16, '#ff9a7a', 'center', 800);
  }
  // Souris
  if (M.souris) {
    const sx = R.x + M.souris.x * R.w, sy = R.y + M.souris.y * R.h;
    const dir = M.souris.vx > 0 ? 1 : -1;
    const pas = Math.sin(tps * 30) * 2;
    ctx.save();
    ctx.translate(sx, sy + pas);
    ctx.scale(dir, 1);
    ctx.strokeStyle = '#8c7f78'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-14, 2); ctx.quadraticCurveTo(-28, -8 + pas, -34, 4); ctx.stroke();
    ctx.fillStyle = '#9d928c';
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, -3, 8, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8b0b0';
    ctx.beginPath(); ctx.arc(11, -10, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1d1d1d';
    ctx.beginPath(); ctx.arc(18, -4, 1.6, 0, Math.PI * 2); ctx.arc(22, -2, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (presents('plongeur').length) ecrire('🧽 ' + presents('plongeur').map((e) => e.nom).join(', ') + ' t’aide', R.x + R.w - 10, R.y + R.h - 14, 12, '#5a3820', 'right', 700);
  if (pointeur.bas) {
    ctx.save();
    ctx.translate(pointeur.x, pointeur.y);
    ctx.rotate(Math.sin(tps * 25) * 0.15);
    ctx.fillStyle = '#f2d24a';

/** @param {number} x @param {number} y @param {number} dl */
function frotter(x, y, dl) {
  const M = S.menage;
  if (!M || M.fini) return;
  attraperSouris(x, y);
  const R = rectMenage();
  let touche = false;
  for (const t of M.taches) {
    if (t.sale <= 0 || t.incrustee) continue;
    const rad = t.r * Math.min(R.w, R.h);
    const cx = R.x + t.x * R.w, cy = R.y + t.y * R.h;
    if (Math.hypot(x - cx, y - cy) < rad * 1.35) {
      t.sale = Math.max(0, t.sale - dl / (rad * 1.5));
      touche = true;
      if (Math.random() < 0.35) ajouterParticule(x, y, 'bulle');
      if (t.sale <= 0) nettoyerTache(t, true);
    }
  }
  if (touche) son('frotte');
}

function dessinerDevanture() {
  const tps = performance.now() / 1000;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f7b267');
  g.addColorStop(0.6, '#f4845f');
  g.addColorStop(1, '#6b3e5a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,240,200,0.9)';
  ctx.beginPath(); ctx.arc(W * 0.8, H * 0.12, Math.min(W, H) * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  for (let i = 0; i < 4; i++) {
    const cx = ((tps * 8 + i * W * 0.37) % (W * 1.3)) - W * 0.15;
    const cy = H * (0.06 + 0.04 * i);
    ctx.beginPath(); ctx.ellipse(cx, cy, W * 0.12, H * 0.018, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#5b4a49';
  ctx.fillRect(0, H * 0.88, W, H * 0.12);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let x = 0; x < W; x += 26) for (let y = H * 0.88; y < H; y += 12) ctx.fillRect(x + ((y / 12) % 2) * 13, y, 22, 9);
  const fw = Math.min(W * 0.9, 560);
  const fx = (W - fw) / 2;
  const fy = H * 0.18;
  const fh = H * 0.72;
  ctx.fillStyle = '#efe0c4';
  ctx.fillRect(fx, fy, fw, fh);
  ctx.fillStyle = '#5a3820';
  ctx.fillRect(fx - 6, fy, fw + 12, fh * 0.16);
  ecrire(E.nomBoulangerie && S.phase !== 'accueil' ? E.nomBoulangerie.toUpperCase() : 'BOULANGERIE', W / 2, fy + fh * 0.08, Math.min(30, fw * 0.07), '#f3c66b', 'center', 800, fw - 20);
  const ns = 9;
  for (let i = 0; i < ns; i++) {
    ctx.fillStyle = i % 2 ? '#fbf3e3' : '#b94a35';
    ctx.beginPath();
    const x0 = fx + (fw / ns) * i, x1 = x0 + fw / ns;
    ctx.moveTo(x0, fy + fh * 0.16); ctx.lineTo(x1, fy + fh * 0.16); ctx.lineTo(x1, fy + fh * 0.26); ctx.quadraticCurveTo((x0 + x1) / 2, fy + fh * 0.31, x0, fy + fh * 0.26); ctx.closePath(); ctx.fill();
  }
  const vit = { x: fx + fw * 0.06, y: fy + fh * 0.36, w: fw * 0.54, h: fh * 0.4 };
  rr(ctx, vit.x, vit.y, vit.w, vit.h, 8);
  const gv = ctx.createRadialGradient(vit.x + vit.w / 2, vit.y + vit.h / 2, 4, vit.x + vit.w / 2, vit.y + vit.h / 2, vit.w * 0.7);
  gv.addColorStop(0, '#fff6dc'); gv.addColorStop(1, '#f3d9a4');
  ctx.fillStyle = gv;
  ctx.fill();
  ctx.strokeStyle = '#7a4c28';
  ctx.lineWidth = 6;
  ctx.stroke();
  /** @type {ProduitId[]} */
  const deco = ['baguette', 'croissant', 'painChoc', 'tradition', 'eclair', 'tarte'];
  deco.forEach((p, i) => dessinerProduit(ctx, p, vit.x + vit.w * (0.2 + (i % 3) * 0.3), vit.y + vit.h * (0.32 + Math.floor(i / 3) * 0.4), vit.w * 0.22, 1));
  ctx.fillStyle = '#7a4c28';
  rr(ctx, fx + fw * 0.68, fy + fh * 0.36, fw * 0.26, fh * 0.64, 6);
  ctx.fill();
  ctx.fillStyle = '#cfe6ee';
  rr(ctx, fx + fw * 0.71, fy + fh * 0.4, fw * 0.2, fh * 0.25, 4);
  ctx.fill();
  if (Math.random() < 0.15) ajouterParticule(fx + fw * entre(0.2, 0.8), fy, 'vapeur');
}

    ' %. Le temps continue de passer au fournil.</p><div class="actions">' + btn('completer', String(CONFIG.majorationExpress), 'Compléter selon la prévision') +
    btn('fermerExpress', '', 'Retour au fournil', 'sec') + '</div>' + htmlReserveLignes(CONFIG.majorationExpress) + '</div>';

/** @param {number} majoration */
function htmlPreparation(majoration) {
  /** @type {Array<[Onglet, string]>} */
  const onglets = [['jour', 'Journée'], ['reserve', 'Réserve'], ['recettes', 'Recettes'], ['equipe', 'Équipe'], ['travaux', 'Travaux']];
  let h = '<div class="carte"><div class="onglets">';
  for (const [id, nom] of onglets) h += '<button type="button" class="onglet' + (S.onglet === id ? ' actif' : '') + '" data-a="onglet" data-v="' + id + '">' + nom + '</button>';
  h += '</div>';
  if (S.onglet === 'jour') h += htmlOngletJour();
  else if (S.onglet === 'reserve') h += '<h2>Réserve et fournisseur</h2><div class="actions" style="justify-content:flex-start;margin:0 0 10px">' + btn('completer', String(majoration), 'Compléter selon la prévision') + '</div>' + htmlReserveLignes(majoration);
  else if (S.onglet === 'recettes') h += htmlOngletRecettes();
  else if (S.onglet === 'equipe') h += htmlOngletEquipe();
  else h += htmlOngletTravaux();
  return h + '</div>';
}

  if (E.bonus) h += '<div class="alerte"><b>' + BONUS[E.bonus].icone + ' Bonus du jour : ' + BONUS[E.bonus].nom + '</b><br>' + BONUS[E.bonus].texte + ' aujourd’hui.</div>';
  if (E.evenement) h += '<div class="alerte"><b>' + EVENEMENTS[E.evenement].nom + '</b><br>' + EVENEMENTS[E.evenement].texte + '</div>';

/** @param {Employe} e */
function iconeRole(e) { return e.role === 'fournier' ? '🧑‍🍳' : e.role === 'vendeur' ? '🧑‍💼' : '🧽'; }
/** Fiche visuelle d'un employé. @param {Employe} e @param {boolean} gestion */
function htmlEmploye(e, gestion) {
  const marche = salaireMarche(e.competence);
  let h = '<div class="ligne" style="grid-template-columns:auto 1fr"><div style="font-size:30px">' + iconeRole(e) + '</div><div><b>' + esc(e.nom) + ' · ' + ROLES[e.role] +
    (e.enFormation ? ' (en formation aujourd’hui)' : '') + '</b>';
  for (const t of tachesDuRole(e.role)) {
    const c = e.taches[t];
    const actif = e.affectation === t;
    h += '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">' +
      (e.role === 'fournier' && !e.enFormation ? btn('affecter', e.id + ':' + t, ICONE_TACHE[t] + ' ' + NOM_TACHE[t] + (actif ? ' ✓' : ''), 'petit' + (actif ? '' : ' sec')) : '<span>' + ICONE_TACHE[t] + ' ' + NOM_TACHE[t] + '</span>') +
      '<span class="dosage chiffres">niv. ' + c.niv + '/' + e.potentiel + ' · travail ≈ ' + etoiles(etoilesAttendues(c.niv)) + '</span>' +
      (gestion ? btn('former', e.id + ':' + t, 'Former · ' + euros(coutFormation(e, t)), 'petit sec', c.niv >= e.potentiel || e.enFormation) : '') + '</div>' +
      '<div class="mini"><i style="width:' + Math.round(100 * c.xp / (8 * c.niv)) + '%"></i></div>';
  }
  if (e.role === 'fournier' && !e.enFormation && !e.affectation) h += '<p class="neg" style="margin:6px 0 0">⚠️ Sans consigne, ' + esc(e.nom) + ' ne fera rien aujourd’hui.</p>';
  if (e.role === 'vendeur') h += '<span class="dosage">Ventes additionnelles : ≈ ' + Math.round(100 * (0.08 + 0.05 * e.taches.vente.niv)) + ' % des clients servis.</span>';
  if (gestion) {
    h += '<span class="dosage chiffres" style="display:block;margin-top:6px">Moral ' + Math.round(e.moral) + ' · ' + euros(e.salaire) + '/jour' + (e.salaire < marche ? ' (sous le marché : ' + euros(marche) + ')' : '') + '</span>' +
      '<div class="mini"><i style="width:' + Math.round(e.moral) + '%;background:' + (e.moral < 35 ? '#b94a35' : '#4f8a45') + '"></i></div>' +
      '<div class="act" style="justify-content:flex-start;margin-top:6px">' + btn('augmenter', String(e.id), '+5 €/j', 'petit sec') + btn('licencier', String(e.id), 'Laisser partir', 'petit sec') + '</div>';
  }
  return h + '</div></div>';
}
